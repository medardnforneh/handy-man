openapi: 3.1.0
info:
  title: HandyMan API
  version: "1.0.0"
  description: >
    Public API for the HandyMan marketplace. Additive-only forever (CLAUDE.md rule #4): never
    remove a field, never tighten a rule, never change an enum's meaning. This spec is the
    SOURCE OF TRUTH for the TypeScript client — the client is generated from it, never hand-written.
servers:
  - url: /api/v1
    description: Version 1 (URL-versioned)

tags:
  - name: Platform
  - name: Notes (reference)

paths:
  /meta:
    get:
      tags: [Platform]
      operationId: getMeta
      summary: API metadata and minimum supported app version
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /notes:
    post:
      tags: [Notes (reference)]
      operationId: createNote
      summary: Create a note (P0-05 reference vertical slice)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /notes/{note}:
    get:
      tags: [Notes (reference)]
      operationId: getNote
      summary: Fetch a note the caller authored
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated UUID. Replaying it returns the stored response (CLAUDE.md rule #3).
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: App build MAJOR.MINOR.PATCH. Builds below the server minimum receive 426.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'

  schemas:
    Money:
      type: object
      description: Money is ALWAYS integer minor units + explicit currency. Never a float, never a formatted string.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples: ["XAF"]

    Meta:
      type: object
      required: [api_version, server_time]
      properties:
        api_version:
          type: string
          examples: ["v1"]
        min_app_version:
          type: [string, "null"]
          examples: ["1.0.0"]
        server_time:
          type: string
          format: date-time

    NoteInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    Note:
      type: object
      required: [id, author_id, body, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: integer
          format: int64
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 7807 problem+json — the single error shape for the whole API.
      required: [type, title, status, detail, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PreconditionUnmet:
      description: >
        A fact-gated capability that isn't satisfied (doc 10). NOT a 403 — a first-class prompt
        naming the missing fact and a deep link to resolve it inline.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error, capability, missing_fact, resolve]
          properties:
            error:
              const: precondition_unmet
            capability:
              type: string
              examples: ["accept_paid_job"]
            missing_fact:
              type: string
              examples: ["identity_verified"]
            required_tier:
              type: [integer, "null"]
            resolve:
              type: object
              required: [type, deep_link]
              properties:
                type:
                  type: string
                deep_link:
                  type: string

  responses:
    Problem:
      description: An error (RFC 7807 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    UpgradeRequired:
      description: The app build is below the supported minimum
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  min_app_version:
                    type: string
                  current_app_version:
                    type: string

security:
  - bearerAuth: []
