openapi: 3.1.0
info:
  title: HandyMan API
  version: "1.0.0"
  description: >
    Public API for the HandyMan marketplace. Additive-only forever (CLAUDE.md rule #4): never
    remove a field, never tighten a rule, never change an enum's meaning. This spec is the
    SOURCE OF TRUTH for the TypeScript client — the client is generated from it, never hand-written.
servers:
  - url: /api/v1
    description: Version 1 (URL-versioned)

tags:
  - name: Platform
  - name: Auth
  - name: Notes (reference)

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request an OTP code (signup or login)
      description: Rate limited by phone (3/hr), IP (10/hr) and device (5/hr). Never returns the code.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: A challenge was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeAccepted"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify an OTP code; creates the user on first success
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Verified (existing user — login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "201":
          description: Verified (new user — signup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      description: Single-use. Replaying an already-rotated token revokes the whole session family.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access token
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Problem"

  /meta:
    get:
      tags: [Platform]
      operationId: getMeta
      summary: API metadata and minimum supported app version
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /skills:
    get:
      tags: [Platform]
      operationId: listSkills
      summary: The skills catalog (categories with leaf children), localized
      security: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        "200":
          description: Skill categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"

  /skills/search:
    get:
      tags: [Platform]
      operationId: searchSkills
      summary: Full-text search leaf skills (matching-language dictionary)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        "200":
          description: Matching leaf skills
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"

  /providers:
    get:
      tags: [Platform]
      operationId: browseProviders
      summary: Browse providers by trade (public)
      security: []
      description: >
        The discover rail, and the API twin of the crawlable `/services` directory. Unauthenticated
        by design: a customer judges whether the marketplace has anyone worth hiring before they sign
        up. A Bearer is OPTIONAL and changes exactly one thing — blocks are honoured for the holder
        (P6-07), and they never see their own card.

        Suspended providers and those not accepting direct approaches are excluded, ranked by
        verification tier then Bayesian-shrunk rating — the same order search and the public
        directory use. Passing a CATEGORY slug matches every trade beneath it.

        Geography is deliberately not a filter: a rail is browsed before there is an address to match
        against, and a service area is PII.
      parameters:
        - name: skill
          in: query
          required: false
          description: A trade slug (leaf or category). Omit to browse the whole pool. An unknown slug returns nobody.
          schema: { type: string, maxLength: 120 }
        - name: mode
          in: query
          required: false
          description: >
            `onsite` = providers who travel (they have declared a service area); `remote` = those who
            do not. Omit for both. The areas themselves are never returned — only this yes/no.
          schema: { type: string, enum: [onsite, remote] }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 30 } }
        - name: locale
          in: query
          description: Language for the skill labels (the taxonomy is bilingual, P1-07).
          schema: { type: string, enum: [fr, en] }
      responses:
        "200":
          description: Providers offering the trade
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PublicProvider" } }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /providers/{party}/metrics:
    get:
      tags: [Platform]
      operationId: providerMetrics
      summary: A provider's display-safe performance metrics
      description: >
        Rolling (90-day) metrics. A rate computed from below the sample-size floor is returned null —
        never "100% on-time (1 job)". The repeat-customer rate and leakage flag are internal admin
        signals and are not exposed here.
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Display-safe metrics
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [jobs_completed_90d, rating_count, on_time_sample]
                    properties:
                      jobs_completed_90d: { type: integer }
                      rating_avg: { type: [number, "null"] }
                      rating_count: { type: integer }
                      on_time_rate: { type: [number, "null"], description: "Null below the sample-size floor." }
                      on_time_sample: { type: integer }

  /engagements/{engagement}/warranty:
    post:
      tags: [Platform]
      operationId: issueWarranty
      summary: Issue a warranty on an engagement (provider)
      description: The provider issues a warranty (one per engagement). It exists only on-platform — the anti-leakage payoff.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_days]
              properties:
                duration_days: { type: integer, minimum: 1, maximum: 3650 }
                terms: { type: [string, "null"], maxLength: 5000 }
      responses:
        "201": { description: The issued warranty, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Warranty" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /warranties/{warranty}/claims:
    post:
      tags: [Platform]
      operationId: fileWarrantyClaim
      summary: File a warranty claim (customer)
      description: >
        The customer files a claim, which spawns a real remedy job — its own engagement and a lead
        assignment to the original worker, free of charge. 409 if the warranty is not active.
      parameters:
        - { name: warranty, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description: { type: string, maxLength: 5000 }
      responses:
        "201": { description: The claim (with its spawned remedy job), content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/WarrantyClaim" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /follow-ups:
    get:
      tags: [Platform]
      operationId: listFollowUps
      summary: The caller's follow-ups (nudges)
      responses:
        "200": { description: The caller's follow-ups, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/FollowUp" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /follow-ups/{followUp}/respond:
    post:
      tags: [Platform]
      operationId: respondToFollowUp
      summary: Record the response action for a follow-up
      description: Every follow-up has exactly one response action; recording the tap is how effectiveness is measured.
      parameters:
        - { name: followUp, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response_action]
              properties:
                response_action: { type: string, enum: [quote_accepted, review_submitted, warranty_claimed, rebooked, approved, dismissed, opened] }
      responses:
        "200": { description: The updated follow-up, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FollowUp" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /providers/{party}/rebook:
    post:
      tags: [Platform]
      operationId: rebookProvider
      summary: Rebook a known provider in one tap
      description: Clones the customer's most recent job with the provider into a fresh open job and sends a direct offer. 422 if there is no prior engagement.
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The new job + offer
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      job_id: { type: string, format: uuid }
                      offer_id: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /referral-code:
    get:
      tags: [Platform]
      operationId: referralCode
      summary: The caller's referral code
      responses:
        "200": { description: The code, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, properties: { code: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /referrals/claim:
    post:
      tags: [Platform]
      operationId: claimReferral
      summary: Claim a referral code (referee)
      description: Guarded against self-referral and a duplicate referee. Qualification + the ledger-backed reward happen server-side on the referee's first completed job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 32 }
      responses:
        "201": { description: The pending referral, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, properties: { id: { type: string, format: uuid }, status: { type: string } } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /provider/customers:
    get:
      tags: [Platform]
      operationId: providerCustomers
      summary: The provider's customer book (CRM)
      description: Each customer the caller has engaged, with job count, completions, lifetime value, last engagement, and do-not-contact status.
      responses:
        "200":
          description: The customer list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        customer_party_id: { type: string, format: uuid }
                        customer_name: { type: string }
                        job_count: { type: integer }
                        completed_count: { type: integer }
                        lifetime_value_minor: { type: integer }
                        last_engaged_at: { type: [string, "null"], format: date-time }
                        do_not_contact: { type: boolean }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/customers/{party}/follow-up:
    post:
      tags: [Platform]
      operationId: scheduleManualFollowUp
      summary: Schedule a manual re-engagement (provider)
      description: Rides the same budget + consent gates as automated follow-ups. 422 if the customer is on the do-not-contact list.
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: The scheduled follow-up, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/FollowUp" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /provider/customers/{party}/do-not-contact:
    post:
      tags: [Platform]
      operationId: setDoNotContact
      summary: Mark a customer do-not-contact (provider)
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: Blocked, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [Platform]
      operationId: removeDoNotContact
      summary: Lift do-not-contact (provider)
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Unblocked, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/complete:
    post:
      tags: [Platform]
      operationId: completeEngagement
      summary: Mark an engagement complete (party)
      description: Sets completion and opens the review window (schedules review follow-ups). Idempotent.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: The completed engagement, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Engagement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /disputes:
    get:
      tags: [Platform]
      operationId: listDisputes
      summary: List the caller's disputes
      responses:
        "200": { description: The caller's disputes, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Dispute" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/disputes:
    post:
      tags: [Platform]
      operationId: raiseDispute
      summary: Raise a dispute on an engagement (party)
      description: A party to the engagement raises a dispute. It queues a human adjudication and alerts staff; it never auto-moves money.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, body]
              properties:
                category: { type: string, enum: [quality, payment, no_show, scope, safety, other] }
                body: { type: string, maxLength: 5000 }
      responses:
        "201": { description: The raised dispute, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Dispute" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/reviews:
    post:
      tags: [Platform]
      operationId: submitReview
      summary: Submit a double-blind review (party)
      description: >
        A party reviews the engagement's other side. The review stays hidden until BOTH parties
        submit or the 14-day window closes — then both reveal at once. One review per author per
        engagement. 403 if the caller is not a party; 409 if they already reviewed.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: [string, "null"], maxLength: 5000 }
                private_note: { type: [string, "null"], maxLength: 5000, description: "Never published; for the subject's eyes only." }
                subject_worker_user_id: { type: [string, "null"], format: uuid, description: "The specific worker, when the provider is an org." }
      responses:
        "201": { description: The submitted (pending) review, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Review" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /providers/{party}/reviews:
    get:
      tags: [Platform]
      operationId: listPartyReviews
      summary: Published reviews for a party
      description: The public reputation signal — only published (revealed) reviews. Pending reviews are never returned.
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Published reviews, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Review" } } } } } } }

  /engagements/{engagement}/share:
    post:
      tags: [Platform]
      operationId: createEngagementShare
      summary: Mint a share-my-job link (participant)
      description: >
        A participant (the customer or an assigned worker) creates an expiring, revocable link that
        shows the engagement's live status to a family member. On-site/hybrid only (422 for remote).
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The share link
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, url, expires_at]
                    properties:
                      id: { type: string, format: uuid }
                      url: { type: string, format: uri }
                      expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagement-shares/{share}:
    delete:
      tags: [Platform]
      operationId: revokeEngagementShare
      summary: Revoke a share-my-job link
      parameters:
        - { name: share, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Revoked, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /safety/panic:
    post:
      tags: [Platform]
      operationId: raisePanic
      summary: Raise a panic alert
      description: >
        Raises a safety alert, texts the caller's emergency contacts, and alerts staff — all
        server-side, so it works with the app backgrounded. Coordinates are optional but travel
        together; an optional assignment ties the alert to the job.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude: { type: number }
                longitude: { type: number }
                note: { type: [string, "null"], maxLength: 2000 }
                assignment_id: { type: [string, "null"], format: uuid }
      responses:
        "201": { description: The raised alert, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SafetyAlert" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /emergency-contacts:
    get:
      tags: [Platform]
      operationId: listEmergencyContacts
      summary: List the caller's emergency contacts
      responses:
        "200": { description: The contacts, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/EmergencyContact" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: addEmergencyContact
      summary: Add an emergency contact
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone_e164]
              properties:
                name: { type: string, maxLength: 255 }
                phone_e164: { type: string, description: "E.164, e.g. +237690000000." }
      responses:
        "201": { description: The contact, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/EmergencyContact" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /emergency-contacts/{contact}:
    delete:
      tags: [Platform]
      operationId: removeEmergencyContact
      summary: Remove an emergency contact
      parameters:
        - { name: contact, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Removed, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /blocks:
    get:
      tags: [Platform]
      operationId: listBlocks
      summary: List the caller's blocks
      responses:
        "200": { description: The caller's blocks, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Block" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: blockParty
      summary: Block a party
      description: A block is honoured in search, dispatch ranking and offer creation — a blocked party is never matched again.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_party_id]
              properties:
                blocked_party_id: { type: string, format: uuid }
      responses:
        "201": { description: The block, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Block" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /blocks/{party}:
    delete:
      tags: [Platform]
      operationId: unblockParty
      summary: Lift a block the caller placed
      parameters:
        - { name: party, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Unblocked, content: { application/json: { schema: { type: object } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /reports:
    post:
      tags: [Platform]
      operationId: fileReport
      summary: File a report about a party
      description: Queues a human review (admin). Never auto-penalises. `off_platform` is a first-class category.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_party_id, category, body]
              properties:
                subject_party_id: { type: string, format: uuid }
                category: { type: string, enum: [fraud, no_show, harassment, safety, spam, off_platform, other] }
                body: { type: string, maxLength: 5000 }
                job_id: { type: [string, "null"], format: uuid }
      responses:
        "201": { description: The filed report, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Report" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /verification-documents:
    get:
      tags: [Platform]
      operationId: listVerificationDocuments
      summary: List the caller's verification documents
      description: The caller's own submitted documents and their review status. Storage paths are never returned.
      responses:
        "200": { description: The caller's documents, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/VerificationDocument" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: submitVerificationDocument
      summary: Submit a verification document
      description: >
        Upload an identity/licence document for human admin review. The file is encrypted at rest in
        a bucket separate from public media and only ever served through a signed short-TTL URL. The
        document's kind fixes the tier it works toward — tier cannot be self-assigned.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [kind, file]
              properties:
                kind: { type: string, enum: [national_id_front, national_id_back, selfie, trade_license, insurance_cert, rccm, niu] }
                file: { type: string, format: binary, description: "Image (jpeg/png/webp) or PDF, max 10 MB." }
                expires_at: { type: [string, "null"], format: date-time, description: "Optional expiry for a licence/insurance cert." }
      responses:
        "201": { description: The submitted document, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/VerificationDocument" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /devices:
    post:
      tags: [Platform]
      operationId: registerDevice
      summary: Register or update the caller's device (push token, app version)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [android, ios, web]
                push_token:
                  type: [string, "null"]
                app_version:
                  type: string
                  pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: The registered device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /consents:
    get:
      tags: [Platform]
      operationId: getConsents
      summary: Current consent state (latest decision per purpose)
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema:
                type: object
                required: [data, policy_version]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
                  policy_version:
                    type: string
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Platform]
      operationId: recordConsent
      summary: Grant or revoke a consent (records the presented locale)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted]
              properties:
                purpose:
                  type: string
                  enum: [terms, privacy, location_tracking, id_verification, marketing]
                granted:
                  type: boolean
                presented_locale:
                  type: string
                  enum: [fr, en]
      responses:
        "201":
          description: Consent recorded
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /me:
    delete:
      tags: [Platform]
      operationId: eraseAccount
      summary: Erase the account and personal data (crypto-shred, irreversible)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Erased }
        "401": { $ref: "#/components/responses/Problem" }

  /me/data-export:
    get:
      tags: [Platform]
      operationId: exportPersonalData
      summary: DSAR — export all personal data held about the caller
      responses:
        "200":
          description: The personal-data export
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
        "401": { $ref: "#/components/responses/Problem" }

  /me/preferences:
    patch:
      tags: [Platform]
      operationId: updatePreferences
      summary: Update UI language and comms language (may differ)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum: [fr, en]
                comms_locale:
                  type: string
                  enum: [fr, en]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"

  /addresses:
    get:
      tags: [Platform]
      operationId: listAddresses
      summary: The caller's addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Platform]
      operationId: createAddress
      summary: Create an address (requires location_tracking consent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: The created address
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: A required consent is missing
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      missing_purpose:
                        type: string
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /jobs:
    get:
      tags: [Platform]
      operationId: listMyJobs
      summary: The customer's own jobs
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Job" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: createJob
      summary: Post a job (address required unless remote)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, engagement_mode, title]
              properties:
                skill_id: { type: string, format: uuid }
                engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
                title: { type: string }
                description: { type: [string, "null"] }
                description_language: { type: string, enum: [fr, en] }
                address_id: { type: [string, "null"], format: uuid }
                price_model: { type: string, enum: [hourly, fixed, quote_only] }
                budget_minor: { type: [integer, "null"] }
                urgency: { type: integer, minimum: 1, maximum: 3 }
                photos: { type: array, items: { type: string } }
      responses:
        "201": { description: Created job, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Job" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /jobs/{job}:
    get:
      tags: [Platform]
      operationId: getJob
      summary: Fetch a job (PII-minimised for non-owners — no exact address)
      parameters:
        - name: job
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Job, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Job" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/cash-settlements:
    post:
      tags: [Platform]
      operationId: recordCashSettlement
      summary: Record a cash-settled amount (provider)
      description: >
        The engagement's provider records that a job (or a named milestone) was settled in cash
        off-platform. The ledger books the platform commission as revenue and as a provider debt
        (provider_receivable); the milestone, if given, is marked paid. Self-reporting builds the
        provider's on-platform history.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                milestone_id: { type: [string, "null"], format: uuid }
      responses:
        "201": { description: The recorded cash settlement, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/CashSettlement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/deliverables:
    post:
      tags: [Platform]
      operationId: submitDeliverable
      summary: Submit a deliverable (provider)
      description: The engagement's provider submits an artifact for review. Narrated into the workspace thread as `deliverable_submitted`.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 255 }
                media_url: { type: [string, "null"], maxLength: 2048 }
                milestone_id: { type: [string, "null"], format: uuid }
      responses:
        "201": { description: The submitted deliverable, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Deliverable" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /deliverables/{deliverable}/review:
    post:
      tags: [Platform]
      operationId: reviewDeliverable
      summary: Accept or reject a deliverable (customer)
      parameters:
        - { name: deliverable, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accept, reject] }
                reject_reason: { type: [string, "null"], maxLength: 2000, description: "Required when decision is reject." }
      responses:
        "200": { description: The reviewed deliverable, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Deliverable" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/check-in:
    post:
      tags: [Platform]
      operationId: checkIn
      summary: Check in at the job site (worker)
      description: >
        An assigned worker opens a work session with server-recorded geo + timestamp, narrated into
        the workspace thread as `arrived`. Exists only for onsite/hybrid engagements — a remote
        engagement returns 422 `check-in-not-supported`. 409 if a session is already open.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkSessionEndpoint" }
      responses:
        "201": { description: The open work session, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/WorkSession" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/check-out:
    post:
      tags: [Platform]
      operationId: checkOut
      summary: Check out (worker)
      description: Closes the worker's open work session with the end geo + timestamp. 409 if no session is open.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkSessionEndpoint" }
      responses:
        "200": { description: The closed work session, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/WorkSession" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/status:
    post:
      tags: [Platform]
      operationId: recordProviderStatus
      summary: Emit a structured status signal (worker)
      description: >
        The worker records a structured status signal (on-the-way / started / paused / resumed /
        completed), narrated into the workspace timeline. `arrived` is emitted only by check-in.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [on_the_way, started, paused, resumed, completed] }
      responses:
        "201": { description: The narrated timeline message, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Message" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/report:
    post:
      tags: [Platform]
      operationId: submitJobReport
      summary: Submit an on-site job report (worker)
      description: >
        An assigned worker submits the on-site report — summary, materials, extra charges, and
        before/after photos. Every photo is EXIF-stripped server-side; the geo it carried is recorded
        in the DB, never left embedded in the served file. Multipart: `photos[i][file]` with
        `photos[i][kind]` and optional per-photo `latitude`/`longitude`.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: string, maxLength: 5000 }
                extra_charges_minor: { type: integer, minimum: 0 }
                materials:
                  type: array
                  items:
                    type: object
                    required: [label, qty, unit_cost_minor]
                    properties:
                      label: { type: string, maxLength: 255 }
                      qty: { type: number, minimum: 0 }
                      unit_cost_minor: { type: integer, minimum: 0 }
                photos:
                  type: array
                  maxItems: 20
                  items:
                    type: object
                    required: [file, kind]
                    properties:
                      file: { type: string, format: binary }
                      kind: { type: string, enum: [before, after, issue] }
                      latitude: { type: number }
                      longitude: { type: number }
      responses:
        "201": { description: The submitted report, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/JobReport" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /milestones/{milestone}/approve:
    post:
      tags: [Platform]
      operationId: approveMilestone
      summary: Approve a milestone → release its slice from escrow
      description: >
        The job's customer approves a milestone, releasing its amount from escrow to the provider net
        of the platform commission. Each approval releases only that slice, so a partial approval
        leaves the remainder escrowed. Idempotent. 409 if escrow isn't funded for the amount.
      parameters:
        - { name: milestone, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: The engagement with updated milestones, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Engagement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/refund:
    post:
      tags: [Platform]
      operationId: refundEngagement
      summary: Refund the remaining escrow to the customer
      description: The job's customer refunds whatever escrow is still held (dispute/cancellation). Already-released milestones are not clawed back here.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { description: Refunded }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /provider/payouts:
    post:
      tags: [Platform]
      operationId: requestPayout
      summary: Request a payout of the provider's payable balance
      description: >
        Withdraw available payable funds to a mobile-money wallet. Idempotent on the Idempotency-Key.
        Funds are reserved by the pending payout; the ledger posts only on gateway confirmation.
        Rejected (422) if the requested amount exceeds the available (unreserved) payable balance.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount_minor, msisdn]
              properties:
                amount_minor: { type: integer, minimum: 1 }
                msisdn: { type: string, maxLength: 20 }
      responses:
        "201": { description: The requested payout, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Payout" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /provider/credits:
    get:
      tags: [Platform]
      operationId: leadCreditBalance
      summary: The provider's prepaid lead-credit balance
      responses:
        "200": { description: Available lead credits, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: object, required: [available], properties: { available: { $ref: "#/components/schemas/Money" } } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/earnings:
    get:
      tags: [Platform]
      operationId: providerEarnings
      summary: The provider's earnings summary — payable balance, reserved payouts, lead credits, and payout history
      description: >
        A read model for the provider's Earnings screen. `payable_available` is what can be withdrawn
        now — the provider_payable balance minus funds already reserved by pending/processing payouts.
        `payable_pending` is that reserved amount. `lead_credits` is the prepaid lead-credit balance.
        `payouts` lists the provider's payouts, newest first.
      responses:
        "200":
          description: Earnings summary
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [payable_available, payable_pending, lead_credits, payouts]
                    properties:
                      payable_available: { $ref: "#/components/schemas/Money" }
                      payable_pending: { $ref: "#/components/schemas/Money" }
                      lead_credits: { $ref: "#/components/schemas/Money" }
                      payouts:
                        type: array
                        items: { $ref: "#/components/schemas/Payout" }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/opportunities:
    get:
      tags: [Platform]
      operationId: providerOpportunities
      summary: The provider's live incoming direct offers
      description: >
        The provider's opportunity feed — pending, unexpired direct offers, newest first. Each offer
        embeds its job PII-minimised: a provider viewing a pre-engagement job sees only the coarse area
        (quarter + city), never the exact address or coordinates. The provider accepts an offer via
        POST /offers/{offer}/accept to form the engagement.
      responses:
        "200":
          description: The provider's live offers
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Offer" }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/work:
    get:
      tags: [Platform]
      operationId: providerWork
      summary: The provider's active-work list
      description: >
        The provider's engagements still in flight (not yet completed or cancelled), newest first — a
        compact list for the Work tab. The check-in / status / report actions live on the work-detail
        screen and target POST /engagements/{engagement}/*.
      responses:
        "200":
          description: The provider's active work
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ProviderWork" }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/work/{engagement}:
    get:
      tags: [Platform]
      operationId: providerWorkDetail
      summary: One engagement's execution view (worker)
      description: >
        Everything the work-detail screen needs in one round-trip. Authorised by the same boundary as
        the execution actions — an active assignment on the engagement — so anything readable here is
        something the caller may actually act on (403 otherwise). The viewer is an assigned worker on
        a formed engagement, so the EXACT site address is included (the coarse-area rule guards the
        PRE-engagement provider). `supports_check_in`, `checked_in`, `current_status` and
        `report_submitted` are derived server-side from the same rows the actions write, so the client
        renders only affordances the server would accept.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The engagement's execution view
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/ProviderWorkDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /payment-intents:
    post:
      tags: [Platform]
      operationId: initiatePaymentIntent
      summary: Start a MoMo collection (escrow or lead credits)
      description: >
        Initiates a mobile-money collection. The response rests in `processing` until the payer
        answers the USSD prompt — the client shows a countdown to `expires_at` and (for redirect
        flows) follows `payment_url`. Idempotent on the Idempotency-Key header: the same key returns
        the same intent, never a second charge. Resolution arrives via webhook or reconciliation poll.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, amount_minor, msisdn]
              properties:
                purpose: { type: string, enum: [escrow, lead_credits] }
                amount_minor: { type: integer, minimum: 1 }
                msisdn: { type: string, maxLength: 20 }
                engagement_id: { type: [string, "null"], format: uuid, description: "Required when purpose is escrow." }
      responses:
        "201": { description: The pending payment intent, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/PaymentIntent" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /webhooks/payments/{gateway}:
    post:
      tags: [Platform]
      operationId: paymentWebhook
      summary: Gateway payment webhook (server-to-server)
      description: >
        Public callback endpoint for a payment gateway. Authenticity is the gateway's signature, not a
        token. Duplicate deliveries are idempotent (deduplicated by insert) — the body is empty and the
        status is 200 for handled/duplicate events, 401 for an invalid signature. Not for client use.
      parameters:
        - { name: gateway, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Handled or already-seen }
        "401": { description: Invalid signature }

  /jobs/{job}/messages:
    get:
      tags: [Platform]
      operationId: listMessages
      summary: The workspace conversation thread (participants only)
      description: >
        The thread, plus the ids the client needs to go live. The thread is keyed by the JOB but the
        realtime channel is keyed by the ENGAGEMENT (`private-engagement.{id}`, P4-03/04), so
        `meta.engagement_id` is returned here rather than making the client hunt for it. REST stays
        authoritative: a reconnecting client refetches this and reconciles (P4-07).
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The thread
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  meta:
                    type: object
                    properties:
                      conversation_id: { type: string, format: uuid }
                      engagement_id:
                        description: Subscribe to `private-engagement.{id}` for live messages. Null if no engagement exists yet.
                        oneOf: [{ type: string, format: uuid }, { type: "null" }]
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: postMessage
      summary: Post a free-form message (participants only)
      description: >
        Posts a free-form message to the workspace thread. `kind` must be `text` — structured kinds
        (quote_accepted, arrived, …) are narrated by the server and rejected here. Detected phone/email
        is flagged (`contact_flag`) but not blocked.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 5000 }
                kind: { type: string, enum: [text], default: text }
                reply_to_id: { type: [string, "null"], format: uuid }
      responses:
        "201": { description: The posted message, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Message" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /jobs/{job}/voice-messages:
    post:
      tags: [Platform]
      operationId: postVoiceMessage
      summary: Post a voice note (participants only)
      description: >
        Uploads a recording as a first-class `voice` message with the audio attached as media —
        speaking a problem is far easier than typing it in a second language, so this is a thread
        entry, not an attachment bolted onto text. Multipart. An empty recording returns 422
        `empty-upload` rather than failing at the database.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: "webm/ogg/mp4/mpeg/aac/wav, max 10 MB." }
                duration_ms: { type: integer, minimum: 1, maximum: 600000 }
      responses:
        "201": { description: The posted voice message, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Message" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /conversations:
    get:
      tags: [Platform]
      operationId: listConversations
      summary: The signed-in user's conversations (the messages tab)
      description: >
        An index over the threads this user participates in, so a conversation can be found without
        already knowing its job. Membership of `conversation_participants` is the only thing that
        decides what appears — the same gate the thread read and post endpoints use.

        `last_message.kind` travels instead of rendered prose: a server-narrated message must be
        shown in the reader's own language, and only the client knows which that is. `preview` is
        populated only for free-form text.
      responses:
        "200":
          description: Conversations, most recently active first
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/ConversationSummary" } }
        "401": { $ref: "#/components/responses/Problem" }

  /conversations/{conversation}/read:
    post:
      tags: [Platform]
      operationId: markConversationRead
      summary: Mark a conversation read up to now (participants only)
      description: >
        Sets the caller's `last_read_at`, which is what gives `unread_count` meaning. Idempotent and
        forward-only: re-opening an old thread never resurrects messages already seen.
      parameters:
        - { name: conversation, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The new read marker
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      last_read_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /media/{media}:
    get:
      tags: [Platform]
      operationId: showMedia
      summary: Fetch a stored media file
      description: >
        Streams a stored file — a voice note's audio or a job report photo. Entitlement is decided
        by what the file hangs off (conversation participants; a report's worker or customer), never
        by holding the id, so a stranger with a valid id gets 403. Verification documents are NOT
        served here: they keep their signed, audited route.
      parameters:
        - { name: media, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: The file bytes, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/quotations:
    post:
      tags: [Platform]
      operationId: submitQuotation
      summary: Submit a priced quotation for a job (provider)
      description: >
        A provider submits a versioned quotation. The subtotal is computed server-side from the
        lines. Only one live (draft/submitted) quote may exist per provider per job — a second
        returns 409; change terms by revising instead. Deposit may not exceed subtotal (422).
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationInput" }
      responses:
        "201": { description: The submitted quotation, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Quotation" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /jobs/{job}/site-visits:
    post:
      tags: [Platform]
      operationId: scheduleSiteVisit
      summary: Schedule a site visit for a job (provider)
      description: >
        A provider schedules a visit (physical for onsite/hybrid, video for remote). A chargeable
        visit must carry a fee; the fee is creditable against the quote the visit produces.
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduled_for]
              properties:
                scheduled_for: { type: string, format: date-time }
                is_chargeable: { type: boolean, default: false }
                fee_minor: { type: integer, minimum: 1, description: "Required when is_chargeable is true." }
      responses:
        "201": { description: The scheduled visit, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SiteVisit" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /site-visits/{siteVisit}/complete:
    post:
      tags: [Platform]
      operationId: completeSiteVisit
      summary: Complete a site visit (provider)
      description: The owning provider marks the visit completed, optionally linking the quotation it produced (which makes a chargeable fee creditable on acceptance).
      parameters:
        - { name: siteVisit, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                outcome_notes: { type: [string, "null"] }
                resulting_quotation_id: { type: [string, "null"], format: uuid }
      responses:
        "200": { description: The completed visit, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/SiteVisit" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /quotations/{quotation}/accept:
    post:
      tags: [Platform]
      operationId: acceptQuotation
      summary: Customer accepts a quotation → engagement + milestones
      description: >
        The job's customer accepts a submitted quotation. Concurrency-safe: exactly one engagement
        forms per job (converging with the offer path). A milestone plan is generated (deposit at
        position 0, then balance) whose amounts sum to the agreed amount; competing live quotes are
        rejected. Only the job owner; only a live, unexpired submitted quote (else 409).
      parameters:
        - { name: quotation, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: The created engagement, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Engagement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /quotations/{quotation}/revise:
    post:
      tags: [Platform]
      operationId: reviseQuotation
      summary: Revise a submitted quotation (new version)
      description: >
        Supersedes the given submitted quotation and creates the next version linked by
        supersedes_id (never an in-place edit). Only the owning provider, and only a submitted quote.
      parameters:
        - { name: quotation, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuotationInput" }
      responses:
        "201": { description: The new version, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Quotation" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /jobs/{job}/offers:
    post:
      tags: [Platform]
      operationId: createDirectOffer
      summary: Offer a job to a chosen provider (customer_direct)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_party_id]
              properties:
                provider_party_id: { type: string, format: uuid }
                amount_minor: { type: [integer, "null"] }
                message: { type: [string, "null"] }
      responses:
        "201": { description: The created offer, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Offer" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /offers/{offer}/accept:
    post:
      tags: [Platform]
      operationId: acceptOffer
      summary: Provider accepts an offer → engagement
      description: >
        The offer's own provider accepts it. Concurrency-safe: exactly one engagement is created per
        job even under simultaneous accepts. Gated on `identity_verified` keyed to the job's
        engagement_mode — remote uses the lighter (phone) check, on-site requires full ID; an unmet
        gate returns a `precondition_unmet` problem (409), not a 403. An individual provider is
        auto-assigned as the engagement lead.
      parameters:
        - { name: offer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: The created engagement, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Engagement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/assignments:
    post:
      tags: [Platform]
      operationId: assignWorker
      summary: Assign a worker to an engagement (dispatcher)
      description: >
        Staff a company engagement. Authorised by org-internal RBAC — an active owner/admin/dispatcher
        of the provider org, or the individual provider themselves. The worker must belong to the
        provider (a dispatcher of org A cannot assign a worker of org B → 422). A second `lead`, or a
        duplicate worker, is a 409.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_user_id]
              properties:
                worker_user_id: { type: string, format: uuid }
                role: { type: string, enum: [lead, helper], default: helper }
                scheduled_from: { type: [string, "null"], format: date-time, description: "Booking window start; both bounds required together. Overlapping windows for one worker are rejected (409)." }
                scheduled_to: { type: [string, "null"], format: date-time }
      responses:
        "201": { description: The created assignment, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Assignment" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/assignments/{assignment}:
    delete:
      tags: [Platform]
      operationId: unassignWorker
      summary: Remove a worker from an engagement (dispatcher)
      description: Soft removal — the row stays with status `removed`, freeing the lead slot. Same authority as assigning.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assignment, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/providers:
    get:
      tags: [Platform]
      operationId: jobMatchingProviders
      summary: Matching providers for a job (geo-filtered for onsite/hybrid, whole pool for remote)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Matching providers, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderProfile" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/publish:
    post:
      tags: [Platform]
      operationId: publishJob
      summary: Publish a draft job (draft → open)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Published job }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /provider/profile:
    get:
      tags: [Platform]
      operationId: getProviderProfile
      summary: The caller's provider profile
      responses:
        "200": { description: Provider profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderProfile" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: createProviderProfile
      summary: Create or update the provider profile (always allowed — doc 10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                headline: { type: [string, "null"] }
                bio: { type: [string, "null"] }
                bio_language: { type: string, enum: [fr, en] }
      responses:
        "200": { description: Provider profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderProfile" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/skills:
    post:
      tags: [Platform]
      operationId: addProviderSkill
      summary: List a skill (requires a provider profile — doc 10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, price_model]
              properties:
                skill_id: { type: string, format: uuid }
                price_model: { type: string, enum: [hourly, fixed, quote_only] }
                rate_minor: { type: [integer, "null"] }
                years_experience: { type: [integer, "null"] }
      responses:
        "201": { description: Listed skill }
        "409":
          description: A required fact is not satisfied (precondition_unmet)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/PreconditionUnmet" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /provider/service-areas:
    post:
      tags: [Platform]
      operationId: setServiceArea
      summary: Set a service area (requires location_tracking consent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, radius_m]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radius_m: { type: integer, minimum: 500, maximum: 100000 }
      responses:
        "201": { description: Service area }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /notes:
    post:
      tags: [Notes (reference)]
      operationId: createNote
      summary: Create a note (P0-05 reference vertical slice)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /notes/{note}:
    get:
      tags: [Notes (reference)]
      operationId: getNote
      summary: Fetch a note the caller authored
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated UUID. Replaying it returns the stored response (CLAUDE.md rule #3).
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: App build MAJOR.MINOR.PATCH. Builds below the server minimum receive 426.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'

  schemas:
    Money:
      type: object
      description: Money is ALWAYS integer minor units + explicit currency. Never a float, never a formatted string.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples: ["XAF"]

    Meta:
      type: object
      required: [api_version, server_time]
      properties:
        api_version:
          type: string
          examples: ["v1"]
        min_app_version:
          type: [string, "null"]
          examples: ["1.0.0"]
        server_time:
          type: string
          format: date-time
        features:
          type: object
          description: Marketplace feature flags (P8-03/04).
          properties:
            dispatch: { type: boolean }
            bidding: { type: boolean }

    Offer:
      type: object
      required: [id, job_id, provider_party_id, origin, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        origin: { type: string, enum: [customer_direct, system_dispatch, provider_bid] }
        status: { type: string, enum: [pending, accepted, declined, withdrawn, expired, superseded] }
        amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        message: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        job:
          description: The PII-minimised job, embedded in the provider's opportunity feed (coarse location only).
          oneOf: [{ $ref: "#/components/schemas/Job" }, { type: "null" }]

    ProviderWork:
      type: object
      required: [id, job_id, reference, title, engagement_mode, job_status, accepted_at]
      properties:
        id: { type: string, format: uuid, description: The engagement id — the check-in/status/report actions target it. }
        job_id: { type: string, format: uuid }
        reference: { type: string }
        title: { type: string }
        customer_name: { type: [string, "null"] }
        engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
        job_status: { type: string, enum: [draft, open, offered, engaged, scheduled, in_progress, work_submitted, completed, cancelled] }
        accepted_at: { type: string, format: date-time }

    ProviderWorkDetail:
      type: object
      required: [id, job_id, assignment_id, reference, title, engagement_mode, job_status, agreed_amount, supports_check_in, supports_report, uses_deliverables, checked_in, report_submitted, deliverables, accepted_at]
      properties:
        id: { type: string, format: uuid, description: The engagement id — the check-in/status/report actions target it. }
        job_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid, description: The caller's active assignment, whose execution state this reports. }
        reference: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        customer_name: { type: [string, "null"] }
        engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
        job_status: { type: string, enum: [draft, open, offered, engaged, scheduled, in_progress, work_submitted, completed, cancelled] }
        agreed_amount: { $ref: "#/components/schemas/Money" }
        scheduled_from: { type: [string, "null"], format: date-time }
        scheduled_to: { type: [string, "null"], format: date-time }
        address:
          description: The EXACT site address — null for modes that have none (remote), per the engagement-mode policy.
          oneOf:
            - type: object
              properties:
                line1: { type: [string, "null"] }
                quarter: { type: [string, "null"] }
                city: { type: [string, "null"] }
                region: { type: [string, "null"] }
                country_code: { type: [string, "null"] }
                landmark_note: { type: [string, "null"] }
                latitude: { type: number }
                longitude: { type: number }
            - type: "null"
        supports_check_in: { type: boolean, description: False for remote — the client must not render a check-in affordance. }
        supports_report: { type: boolean, description: Whether this mode proves work with an on-site job report. False for remote. }
        uses_deliverables: { type: boolean, description: Whether this mode proves work with deliverables. True for remote and hybrid. }
        checked_in: { type: boolean, description: Derived from an OPEN work session, not a stored flag. }
        checked_in_at: { type: [string, "null"], format: date-time }
        current_status:
          description: The latest execution status narrated for this worker, or null before any signal.
          oneOf:
            - { type: string, enum: [on_the_way, arrived, started, paused, resumed, completed] }
            - type: "null"
        report_submitted: { type: boolean }
        deliverables:
          description: The remote path's proof-of-work history — the counterpart of report_submitted.
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: string, format: uuid }
              title: { type: string }
              status: { type: string, enum: [pending, submitted, accepted, rejected] }
              submitted_at: { type: [string, "null"], format: date-time }
              reject_reason: { type: [string, "null"] }
        accepted_at: { type: string, format: date-time }

    Engagement:
      type: object
      required: [id, job_id, provider_party_id, agreed_amount, is_escrowed, accepted_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        offer_id: { type: [string, "null"], format: uuid }
        quotation_id: { type: [string, "null"], format: uuid }
        agreed_amount: { $ref: "#/components/schemas/Money" }
        visit_credit: { $ref: "#/components/schemas/Money" }
        is_escrowed: { type: boolean }
        accepted_at: { type: string, format: date-time }
        assignments: { type: array, items: { $ref: "#/components/schemas/Assignment" } }
        milestones: { type: array, items: { $ref: "#/components/schemas/Milestone" } }

    CashSettlement:
      type: object
      required: [id, engagement_id, amount, commission, recorded_at]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        milestone_id: { type: [string, "null"], format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        commission: { $ref: "#/components/schemas/Money" }
        recorded_at: { type: string, format: date-time }

    Payout:
      type: object
      required: [id, amount, msisdn, status, requested_at]
      properties:
        id: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        msisdn: { type: string }
        status: { type: string, enum: [pending, processing, succeeded, failed, expired] }
        external_ref: { type: [string, "null"] }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        reversed_at: { type: [string, "null"], format: date-time }
        failure_code: { type: [string, "null"] }

    PaymentIntent:
      type: object
      required: [id, purpose, status, amount, msisdn, expires_at, initiated_at]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [escrow, lead_credits] }
        status: { type: string, enum: [pending, processing, succeeded, failed, expired] }
        amount: { $ref: "#/components/schemas/Money" }
        msisdn: { type: string }
        external_ref: { type: [string, "null"] }
        payment_url: { type: [string, "null"] }
        expires_at: { type: string, format: date-time }
        initiated_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }
        failure_code: { type: [string, "null"] }

    SiteVisit:
      type: object
      required: [id, job_id, provider_party_id, scheduled_for, is_chargeable, fee, status]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        scheduled_for: { type: string, format: date-time }
        is_chargeable: { type: boolean }
        fee: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [scheduled, completed, cancelled, no_show] }
        completed_at: { type: [string, "null"], format: date-time }
        outcome_notes: { type: [string, "null"] }
        resulting_quotation_id: { type: [string, "null"], format: uuid }

    Milestone:
      type: object
      required: [id, position, title, amount_minor, status]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        title: { type: string }
        amount_minor: { type: integer }
        status: { type: string, enum: [pending, in_progress, submitted, approved, rejected, paid] }

    Assignment:
      type: object
      required: [id, worker_user_id, role, status]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        worker_user_id: { type: string, format: uuid }
        assigned_by_user_id: { type: string, format: uuid }
        role: { type: string, enum: [lead, helper] }
        status: { type: string, enum: [assigned, accepted, declined, en_route, on_site, completed, removed] }
        assigned_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        scheduled_from: { type: [string, "null"], format: date-time }
        scheduled_to: { type: [string, "null"], format: date-time }

    Deliverable:
      type: object
      required: [id, engagement_id, title, status]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        milestone_id: { type: [string, "null"], format: uuid }
        title: { type: string }
        media_url: { type: [string, "null"] }
        status: { type: string, enum: [pending, submitted, accepted, rejected] }
        submitted_at: { type: [string, "null"], format: date-time }
        reviewed_at: { type: [string, "null"], format: date-time }
        reject_reason: { type: [string, "null"] }

    Message:
      type: object
      required: [id, conversation_id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_user_id: { type: [string, "null"], format: uuid, description: "Null for pure server narration." }
        kind:
          type: string
          enum: [text, voice, media, document, system, quote_submitted, quote_revised, quote_accepted, quote_rejected, milestone_submitted, milestone_approved, milestone_rejected, site_visit_proposed, site_visit_confirmed, on_the_way, arrived, started, paused, resumed, completed, payment_requested, payment_received, deliverable_submitted]
        body: { type: [string, "null"] }
        payload: { type: [object, "null"], additionalProperties: true }
        contact_flag: { type: [string, "null"], enum: [phone, email, null] }
        reply_to_id: { type: [string, "null"], format: uuid }
        media:
          description: >
            Attached files — today a voice note's audio (P4-05). `url` is the authorized media
            route; the raw storage path is never returned.
          type: array
          items:
            type: object
            required: [id, url]
            properties:
              id: { type: string, format: uuid }
              url: { type: string, format: uri }
              bytes: { type: integer }
        created_at: { type: string, format: date-time }

    PublicProvider:
      type: object
      description: >
        A provider as an anonymous or pre-engagement viewer may see them (doc 08): the public
        headline, the verification badge, the shrunk rating and the trades offered. Never a person's
        name, never a service area, never a coordinate. `party_id` is the handle every other public
        endpoint takes (metrics, reviews) and what an offer is addressed to.
      required: [party_id, verification_tier]
      properties:
        party_id: { type: string, format: uuid }
        headline: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        verification_tier: { type: integer }
        rating_avg:
          description: Bayesian-shrunk (P6-09) — never a bare "5.0 (1 review)". Null when unrated.
          type: [string, "null"]
        rating_count: { type: integer }
        jobs_completed: { type: integer }
        serves_onsite:
          description: Whether they travel to the customer. A yes/no about the kind of work — never where they are.
          type: boolean
        skills:
          type: array
          items:
            type: object
            properties:
              skill_id: { type: string, format: uuid }
              name: { type: [string, "null"], description: Localized label for the requested locale. }

    ConversationSummary:
      type: object
      description: >
        One row of the messages tab. `job_id` is what the client navigates with — the workspace route
        is keyed by job, not by conversation.
      required: [id, job_id, unread_count]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        reference: { type: [string, "null"] }
        title: { type: [string, "null"] }
        status: { type: [string, "null"] }
        counterpart_name:
          description: >
            The other side, from this user's point of view — the provider for a customer, the
            customer for a provider. Null before an engagement exists (there is no provider yet).
          type: [string, "null"]
        unread_count: { type: integer }
        last_message:
          type: [object, "null"]
          required: [kind, created_at]
          properties:
            kind: { type: string }
            preview:
              description: The message text; null for voice and for every server-narrated kind (render those from `kind`).
              type: [string, "null"]
            mine: { type: boolean }
            created_at: { type: string, format: date-time }

    WorkSessionEndpoint:
      type: object
      description: One end (start or end) of a work session — geo captured server-side.
      properties:
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        accuracy_m: { type: [number, "null"], description: "Device GPS accuracy in metres." }

    WorkSession:
      type: object
      required: [id, assignment_id, started_at, is_open]
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        is_open: { type: boolean }
        start: { oneOf: [ { $ref: "#/components/schemas/WorkSessionEndpoint" }, { type: "null" } ] }
        end: { oneOf: [ { $ref: "#/components/schemas/WorkSessionEndpoint" }, { type: "null" } ] }

    Media:
      type: object
      required: [id, kind, storage_path, sha256, bytes]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [before, after, issue, id_doc, attachment] }
        storage_path: { type: string }
        sha256: { type: string }
        bytes: { type: integer }
        captured_at: { type: [string, "null"], format: date-time }

    JobReport:
      type: object
      required: [id, assignment_id, summary, materials, extra_charges_minor]
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        summary: { type: string }
        materials:
          type: array
          items:
            type: object
            properties:
              label: { type: string }
              qty: { type: number }
              unit_cost_minor: { type: integer }
        extra_charges_minor: { type: integer }
        submitted_at: { type: [string, "null"], format: date-time }
        media:
          type: array
          items: { $ref: "#/components/schemas/Media" }

    FollowUp:
      type: object
      required: [id, kind, channel, status, scheduled_for]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        channel: { type: string, enum: [in_app, push, sms, whatsapp, email] }
        status: { type: string, enum: [scheduled, sent, cancelled, responded, failed, suppressed] }
        scheduled_for: { type: string, format: date-time }
        job_id: { type: [string, "null"], format: uuid }
        engagement_id: { type: [string, "null"], format: uuid }
        quotation_id: { type: [string, "null"], format: uuid }
        warranty_id: { type: [string, "null"], format: uuid }
        response_action: { type: [string, "null"] }

    Warranty:
      type: object
      required: [id, engagement_id, duration_days, starts_at, expires_at, status]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        duration_days: { type: integer }
        starts_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [active, claimed, expired, void] }
        terms: { type: [string, "null"] }

    WarrantyClaim:
      type: object
      required: [id, warranty_id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        warranty_id: { type: string, format: uuid }
        description: { type: string }
        status: { type: string, enum: [open, remedied, rejected] }
        remedy_job_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }

    Dispute:
      type: object
      required: [id, engagement_id, category, status, created_at]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        category: { type: string, enum: [quality, payment, no_show, scope, safety, other] }
        status: { type: string, enum: [open, reviewing, resolved, rejected] }
        resolution_note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    SafetyAlert:
      type: object
      required: [id, kind, status, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [panic, no_show, unsafe_site, harassment, check_in_overdue] }
        status: { type: string, enum: [open, acknowledged, resolved] }
        note: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        resolved_at: { type: [string, "null"], format: date-time }

    EmergencyContact:
      type: object
      required: [id, name, phone_e164, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        phone_e164: { type: string }
        created_at: { type: string, format: date-time }

    Review:
      type: object
      required: [id, engagement_id, author_party_id, subject_party_id, visibility, submitted_at, window_closes_at]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        author_party_id: { type: string, format: uuid }
        subject_party_id: { type: string, format: uuid }
        visibility: { type: string, enum: [pending, published, withheld] }
        rating: { type: [integer, "null"], minimum: 1, maximum: 5, description: "Null until published." }
        body: { type: [string, "null"], description: "Null until published." }
        submitted_at: { type: string, format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        window_closes_at: { type: string, format: date-time }

    Block:
      type: object
      required: [party_id, blocked_party_id, created_at]
      properties:
        party_id: { type: string, format: uuid }
        blocked_party_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    Report:
      type: object
      required: [id, subject_party_id, category, status, created_at]
      properties:
        id: { type: string, format: uuid }
        subject_party_id: { type: string, format: uuid }
        job_id: { type: [string, "null"], format: uuid }
        category: { type: string, enum: [fraud, no_show, harassment, safety, spam, off_platform, other] }
        status: { type: string, enum: [open, reviewing, resolved, dismissed] }
        created_at: { type: string, format: date-time }

    VerificationDocument:
      type: object
      required: [id, kind, status, grants_tier, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [national_id_front, national_id_back, selfie, trade_license, insurance_cert, rccm, niu] }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        grants_tier: { type: integer, minimum: 0, maximum: 3 }
        reject_reason: { type: [string, "null"] }
        reviewed_at: { type: [string, "null"], format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    Quotation:
      type: object
      required: [id, job_id, provider_party_id, version, status, subtotal, deposit, valid_until]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        version: { type: integer }
        supersedes_id: { type: [string, "null"], format: uuid }
        status: { type: string, enum: [draft, submitted, accepted, rejected, expired, withdrawn, superseded] }
        subtotal: { $ref: "#/components/schemas/Money" }
        deposit: { $ref: "#/components/schemas/Money" }
        notes: { type: [string, "null"] }
        customer_requested_by: { type: [string, "null"], format: date-time }
        provider_estimated_at: { type: [string, "null"], format: date-time }
        provider_committed_at: { type: [string, "null"], format: date-time }
        valid_until: { type: string, format: date-time }
        submitted_at: { type: [string, "null"], format: date-time }
        responded_at: { type: [string, "null"], format: date-time }
        lines:
          type: array
          items: { $ref: "#/components/schemas/QuotationLine" }

    QuotationLine:
      type: object
      required: [position, kind, label, quantity, unit_price_minor]
      properties:
        position: { type: integer }
        kind: { type: string, enum: [labour, material, travel, other] }
        label: { type: string }
        quantity: { type: string, description: "Decimal string, e.g. \"1.500\"" }
        unit_price_minor: { type: integer }

    QuotationInput:
      type: object
      required: [lines, valid_until]
      properties:
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required: [kind, label, quantity, unit_price_minor]
            properties:
              kind: { type: string, enum: [labour, material, travel, other] }
              label: { type: string, maxLength: 255 }
              quantity: { type: number, exclusiveMinimum: 0 }
              unit_price_minor: { type: integer, minimum: 0 }
        deposit_minor: { type: integer, minimum: 0, default: 0 }
        notes: { type: [string, "null"] }
        valid_until: { type: string, format: date-time }
        customer_requested_by: { type: [string, "null"], format: date-time }
        provider_estimated_at: { type: [string, "null"], format: date-time }
        provider_committed_at: { type: [string, "null"], format: date-time }

    Job:
      type: object
      required: [id, reference, title, engagement_mode, status]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        skill_id: { type: string, format: uuid }
        engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
        assignment_mode: { type: string, enum: [direct, dispatch, bidding] }
        status: { type: string }
        price_model: { type: string }
        budget: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        urgency: { type: integer }
        requires_verified_provider: { type: boolean }
        photos: { type: array, items: { type: string } }
        location:
          description: Coarse (quarter/city) for non-owners; exact (line1 + lat/lng) only for the owner. Null for remote jobs.
          oneOf:
            - type: "null"
            - type: object
              properties:
                quarter: { type: [string, "null"] }
                city: { type: string }
                region: { type: [string, "null"] }
                country_code: { type: string }
                line1: { type: string }
                landmark_note: { type: [string, "null"] }
                latitude: { type: number }
                longitude: { type: number }
        engagement:
          description: Compact engagement summary for the owner — provider, agreed money, milestone progress. Null until the job is engaged, and absent for non-owners.
          oneOf:
            - type: "null"
            - type: object
              properties:
                provider_name: { type: [string, "null"] }
                agreed_amount_minor: { type: integer }
                currency: { type: string }
                milestones_done: { type: integer }
                milestones_total: { type: integer }
                milestones:
                  type: array
                  items:
                    type: object
                    required: [id, title, amount_minor, status]
                    properties:
                      id: { type: string, format: uuid }
                      title: { type: string }
                      amount_minor: { type: integer }
                      status: { type: string, enum: [pending, in_progress, submitted, approved, rejected, paid] }
        published_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ProviderProfile:
      type: object
      required: [id, party_id, verification_tier]
      properties:
        id: { type: string, format: uuid, description: The provider_profiles row id. NOT the handle other endpoints take — use party_id. }
        party_id:
          type: string
          format: uuid
          description: >
            The provider's PARTY id — the handle every other endpoint takes (POST /jobs/{job}/offers,
            GET /providers/{party}/metrics, GET /providers/{party}/reviews). Distinct from `id`.
        display_name: { type: [string, "null"], description: Present only where the viewer is entitled to it — withheld from a pre-engagement match list. }
        headline: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        bio_language: { type: [string, "null"] }
        verification_tier: { type: integer }
        rating_avg: { type: [string, "null"] }
        rating_count: { type: integer }
        jobs_completed: { type: integer }
        accepts_direct: { type: boolean }
        accepts_dispatch: { type: boolean }
        accepts_bidding: { type: boolean }
        skills:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              skill_id: { type: string, format: uuid }
              name: { type: string, description: The skill's label in the requested (or app) locale — the taxonomy is bilingual. }
              price_model: { type: string, enum: [hourly, fixed, quote_only] }
              rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
              years_experience: { type: [integer, "null"] }
        service_areas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              latitude: { type: number }
              longitude: { type: number }
              radius_m: { type: integer }

    Skill:
      type: object
      required: [id, slug, name, is_leaf, risk_tier, requires_license]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string, description: Localized name for the requested locale. }
        is_leaf: { type: boolean }
        risk_tier: { type: integer, minimum: 1, maximum: 3 }
        requires_license: { type: boolean }
        children:
          type: array
          items:
            $ref: "#/components/schemas/Skill"

    OtpRequestInput:
      type: object
      required: [phone_e164, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          examples: ["+237699000111"]
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpVerifyInput:
      type: object
      required: [phone_e164, code, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        code:
          type: string
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpChallengeAccepted:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    User:
      type: object
      required: [id, phone_e164, locale, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        phone_e164:
          type: string
        email:
          type: [string, "null"]
        locale:
          type: string
          enum: [fr, en]
        comms_locale:
          type: string
          enum: [fr, en]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        phone_verified_at:
          type: [string, "null"]
          format: date-time

    TokenPair:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_at]
      properties:
        token_type:
          type: string
          examples: ["Bearer"]
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      required: [data, registered, tokens]
      properties:
        data:
          $ref: "#/components/schemas/User"
        registered:
          type: boolean
        tokens:
          $ref: "#/components/schemas/TokenPair"

    Device:
      type: object
      required: [id, platform, app_version, has_push_token]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios, web]
        app_version:
          type: string
        has_push_token:
          type: boolean
        last_seen_at:
          type: [string, "null"]
          format: date-time

    AddressInput:
      type: object
      required: [line1, city, latitude, longitude]
      properties:
        label: { type: [string, "null"] }
        line1: { type: string }
        quarter: { type: [string, "null"] }
        city: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        landmark_note: { type: [string, "null"] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    Address:
      type: object
      required: [id, line1, city, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        line1: { type: string }
        quarter: { type: [string, "null"] }
        city: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string }
        landmark_note: { type: [string, "null"] }
        latitude: { type: number }
        longitude: { type: number }

    NoteInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    Note:
      type: object
      required: [id, author_id, body, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 7807 problem+json — the single error shape for the whole API.
      required: [type, title, status, detail, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PreconditionUnmet:
      description: >
        A fact-gated capability that isn't satisfied (doc 10). NOT a 403 — a first-class prompt
        naming the missing fact and a deep link to resolve it inline.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error, capability, missing_fact, resolve]
          properties:
            error:
              const: precondition_unmet
            capability:
              type: string
              examples: ["accept_paid_job"]
            missing_fact:
              type: string
              examples: ["identity_verified"]
            required_tier:
              type: [integer, "null"]
            resolve:
              type: object
              required: [type, deep_link]
              properties:
                type:
                  type: string
                deep_link:
                  type: string

  responses:
    Problem:
      description: An error (RFC 7807 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    UpgradeRequired:
      description: The app build is below the supported minimum
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  min_app_version:
                    type: string
                  current_app_version:
                    type: string

security:
  - bearerAuth: []
