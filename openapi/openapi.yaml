openapi: 3.1.0
info:
  title: HandyMan API
  version: "1.0.0"
  description: >
    Public API for the HandyMan marketplace. Additive-only forever (CLAUDE.md rule #4): never
    remove a field, never tighten a rule, never change an enum's meaning. This spec is the
    SOURCE OF TRUTH for the TypeScript client — the client is generated from it, never hand-written.
servers:
  - url: /api/v1
    description: Version 1 (URL-versioned)

tags:
  - name: Platform
  - name: Auth
  - name: Notes (reference)

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request an OTP code (signup or login)
      description: Rate limited by phone (3/hr), IP (10/hr) and device (5/hr). Never returns the code.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: A challenge was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeAccepted"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify an OTP code; creates the user on first success
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Verified (existing user — login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "201":
          description: Verified (new user — signup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      description: Single-use. Replaying an already-rotated token revokes the whole session family.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access token
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Problem"

  /meta:
    get:
      tags: [Platform]
      operationId: getMeta
      summary: API metadata and minimum supported app version
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /devices:
    post:
      tags: [Platform]
      operationId: registerDevice
      summary: Register or update the caller's device (push token, app version)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [android, ios, web]
                push_token:
                  type: [string, "null"]
                app_version:
                  type: string
                  pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: The registered device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /notes:
    post:
      tags: [Notes (reference)]
      operationId: createNote
      summary: Create a note (P0-05 reference vertical slice)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /notes/{note}:
    get:
      tags: [Notes (reference)]
      operationId: getNote
      summary: Fetch a note the caller authored
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated UUID. Replaying it returns the stored response (CLAUDE.md rule #3).
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: App build MAJOR.MINOR.PATCH. Builds below the server minimum receive 426.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'

  schemas:
    Money:
      type: object
      description: Money is ALWAYS integer minor units + explicit currency. Never a float, never a formatted string.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples: ["XAF"]

    Meta:
      type: object
      required: [api_version, server_time]
      properties:
        api_version:
          type: string
          examples: ["v1"]
        min_app_version:
          type: [string, "null"]
          examples: ["1.0.0"]
        server_time:
          type: string
          format: date-time

    OtpRequestInput:
      type: object
      required: [phone_e164, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          examples: ["+237699000111"]
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpVerifyInput:
      type: object
      required: [phone_e164, code, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        code:
          type: string
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpChallengeAccepted:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    User:
      type: object
      required: [id, phone_e164, locale, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        phone_e164:
          type: string
        email:
          type: [string, "null"]
        locale:
          type: string
          enum: [fr, en]
        comms_locale:
          type: string
          enum: [fr, en]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        phone_verified_at:
          type: [string, "null"]
          format: date-time

    TokenPair:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_at]
      properties:
        token_type:
          type: string
          examples: ["Bearer"]
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      required: [data, registered, tokens]
      properties:
        data:
          $ref: "#/components/schemas/User"
        registered:
          type: boolean
        tokens:
          $ref: "#/components/schemas/TokenPair"

    Device:
      type: object
      required: [id, platform, app_version, has_push_token]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios, web]
        app_version:
          type: string
        has_push_token:
          type: boolean
        last_seen_at:
          type: [string, "null"]
          format: date-time

    NoteInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    Note:
      type: object
      required: [id, author_id, body, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 7807 problem+json — the single error shape for the whole API.
      required: [type, title, status, detail, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PreconditionUnmet:
      description: >
        A fact-gated capability that isn't satisfied (doc 10). NOT a 403 — a first-class prompt
        naming the missing fact and a deep link to resolve it inline.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error, capability, missing_fact, resolve]
          properties:
            error:
              const: precondition_unmet
            capability:
              type: string
              examples: ["accept_paid_job"]
            missing_fact:
              type: string
              examples: ["identity_verified"]
            required_tier:
              type: [integer, "null"]
            resolve:
              type: object
              required: [type, deep_link]
              properties:
                type:
                  type: string
                deep_link:
                  type: string

  responses:
    Problem:
      description: An error (RFC 7807 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    UpgradeRequired:
      description: The app build is below the supported minimum
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  min_app_version:
                    type: string
                  current_app_version:
                    type: string

security:
  - bearerAuth: []
