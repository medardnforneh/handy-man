openapi: 3.1.0
info:
  title: HandyMan API
  version: "1.0.0"
  description: >
    Public API for the HandyMan marketplace. Additive-only forever (CLAUDE.md rule #4): never
    remove a field, never tighten a rule, never change an enum's meaning. This spec is the
    SOURCE OF TRUTH for the TypeScript client — the client is generated from it, never hand-written.
servers:
  - url: /api/v1
    description: Version 1 (URL-versioned)

tags:
  - name: Platform
  - name: Auth
  - name: Notes (reference)

paths:
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      summary: Request an OTP code (signup or login)
      description: Rate limited by phone (3/hr), IP (10/hr) and device (5/hr). Never returns the code.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: A challenge was issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallengeAccepted"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      summary: Verify an OTP code; creates the user on first success
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyInput"
      responses:
        "200":
          description: Verified (existing user — login)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "201":
          description: Verified (new user — signup)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserEnvelope"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "429":
          $ref: "#/components/responses/Problem"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and get a new access token
      description: Single-use. Replaying an already-rotated token revokes the whole session family.
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: A fresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: The authenticated user
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current access token
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Logged out
        "401":
          $ref: "#/components/responses/Problem"

  /meta:
    get:
      tags: [Platform]
      operationId: getMeta
      summary: API metadata and minimum supported app version
      security: []
      responses:
        "200":
          description: Server metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
        "426":
          $ref: "#/components/responses/UpgradeRequired"

  /skills:
    get:
      tags: [Platform]
      operationId: listSkills
      summary: The skills catalog (categories with leaf children), localized
      security: []
      parameters:
        - name: locale
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        "200":
          description: Skill categories
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"

  /skills/search:
    get:
      tags: [Platform]
      operationId: searchSkills
      summary: Full-text search leaf skills (matching-language dictionary)
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: locale
          in: query
          schema: { type: string, enum: [fr, en] }
      responses:
        "200":
          description: Matching leaf skills
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Skill"

  /devices:
    post:
      tags: [Platform]
      operationId: registerDevice
      summary: Register or update the caller's device (push token, app version)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: X-Device-Id
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [android, ios, web]
                push_token:
                  type: [string, "null"]
                app_version:
                  type: string
                  pattern: '^\d+\.\d+\.\d+$'
      responses:
        "200":
          description: The registered device
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Device"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /consents:
    get:
      tags: [Platform]
      operationId: getConsents
      summary: Current consent state (latest decision per purpose)
      responses:
        "200":
          description: Consent state
          content:
            application/json:
              schema:
                type: object
                required: [data, policy_version]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
                  policy_version:
                    type: string
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Platform]
      operationId: recordConsent
      summary: Grant or revoke a consent (records the presented locale)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose, granted]
              properties:
                purpose:
                  type: string
                  enum: [terms, privacy, location_tracking, id_verification, marketing]
                granted:
                  type: boolean
                presented_locale:
                  type: string
                  enum: [fr, en]
      responses:
        "201":
          description: Consent recorded
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /me:
    delete:
      tags: [Platform]
      operationId: eraseAccount
      summary: Erase the account and personal data (crypto-shred, irreversible)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Erased }
        "401": { $ref: "#/components/responses/Problem" }

  /me/data-export:
    get:
      tags: [Platform]
      operationId: exportPersonalData
      summary: DSAR — export all personal data held about the caller
      responses:
        "200":
          description: The personal-data export
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
        "401": { $ref: "#/components/responses/Problem" }

  /me/preferences:
    patch:
      tags: [Platform]
      operationId: updatePreferences
      summary: Update UI language and comms language (may differ)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                locale:
                  type: string
                  enum: [fr, en]
                comms_locale:
                  type: string
                  enum: [fr, en]
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Problem"

  /addresses:
    get:
      tags: [Platform]
      operationId: listAddresses
      summary: The caller's addresses
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Platform]
      operationId: createAddress
      summary: Create an address (requires location_tracking consent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: The created address
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Address"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          description: A required consent is missing
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      missing_purpose:
                        type: string
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /jobs:
    get:
      tags: [Platform]
      operationId: listMyJobs
      summary: The customer's own jobs
      responses:
        "200": { description: Jobs, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/Job" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: createJob
      summary: Post a job (address required unless remote)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, engagement_mode, title]
              properties:
                skill_id: { type: string, format: uuid }
                engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
                title: { type: string }
                description: { type: [string, "null"] }
                description_language: { type: string, enum: [fr, en] }
                address_id: { type: [string, "null"], format: uuid }
                price_model: { type: string, enum: [hourly, fixed, quote_only] }
                budget_minor: { type: [integer, "null"] }
                urgency: { type: integer, minimum: 1, maximum: 3 }
                photos: { type: array, items: { type: string } }
      responses:
        "201": { description: Created job, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Job" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /jobs/{job}:
    get:
      tags: [Platform]
      operationId: getJob
      summary: Fetch a job (PII-minimised for non-owners — no exact address)
      parameters:
        - name: job
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Job, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Job" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/offers:
    post:
      tags: [Platform]
      operationId: createDirectOffer
      summary: Offer a job to a chosen provider (customer_direct)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider_party_id]
              properties:
                provider_party_id: { type: string, format: uuid }
                amount_minor: { type: [integer, "null"] }
                message: { type: [string, "null"] }
      responses:
        "201": { description: The created offer, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Offer" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /offers/{offer}/accept:
    post:
      tags: [Platform]
      operationId: acceptOffer
      summary: Provider accepts an offer → engagement
      description: >
        The offer's own provider accepts it. Concurrency-safe: exactly one engagement is created per
        job even under simultaneous accepts. Gated on `identity_verified` keyed to the job's
        engagement_mode — remote uses the lighter (phone) check, on-site requires full ID; an unmet
        gate returns a `precondition_unmet` problem (409), not a 403. An individual provider is
        auto-assigned as the engagement lead.
      parameters:
        - { name: offer, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201": { description: The created engagement, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Engagement" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }

  /engagements/{engagement}/assignments:
    post:
      tags: [Platform]
      operationId: assignWorker
      summary: Assign a worker to an engagement (dispatcher)
      description: >
        Staff a company engagement. Authorised by org-internal RBAC — an active owner/admin/dispatcher
        of the provider org, or the individual provider themselves. The worker must belong to the
        provider (a dispatcher of org A cannot assign a worker of org B → 422). A second `lead`, or a
        duplicate worker, is a 409.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [worker_user_id]
              properties:
                worker_user_id: { type: string, format: uuid }
                role: { type: string, enum: [lead, helper], default: helper }
                scheduled_from: { type: [string, "null"], format: date-time, description: "Booking window start; both bounds required together. Overlapping windows for one worker are rejected (409)." }
                scheduled_to: { type: [string, "null"], format: date-time }
      responses:
        "201": { description: The created assignment, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/Assignment" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /engagements/{engagement}/assignments/{assignment}:
    delete:
      tags: [Platform]
      operationId: unassignWorker
      summary: Remove a worker from an engagement (dispatcher)
      description: Soft removal — the row stays with status `removed`, freeing the lead slot. Same authority as assigning.
      parameters:
        - { name: engagement, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: assignment, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Removed }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/providers:
    get:
      tags: [Platform]
      operationId: jobMatchingProviders
      summary: Matching providers for a job (geo-filtered for onsite/hybrid, whole pool for remote)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Matching providers, content: { application/json: { schema: { type: object, required: [data], properties: { data: { type: array, items: { $ref: "#/components/schemas/ProviderProfile" } } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /jobs/{job}/publish:
    post:
      tags: [Platform]
      operationId: publishJob
      summary: Publish a draft job (draft → open)
      parameters:
        - { name: job, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Published job }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /provider/profile:
    get:
      tags: [Platform]
      operationId: getProviderProfile
      summary: The caller's provider profile
      responses:
        "200": { description: Provider profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderProfile" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [Platform]
      operationId: createProviderProfile
      summary: Create or update the provider profile (always allowed — doc 10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                headline: { type: [string, "null"] }
                bio: { type: [string, "null"] }
                bio_language: { type: string, enum: [fr, en] }
      responses:
        "200": { description: Provider profile, content: { application/json: { schema: { type: object, required: [data], properties: { data: { $ref: "#/components/schemas/ProviderProfile" } } } } } }
        "401": { $ref: "#/components/responses/Problem" }

  /provider/skills:
    post:
      tags: [Platform]
      operationId: addProviderSkill
      summary: List a skill (requires a provider profile — doc 10)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [skill_id, price_model]
              properties:
                skill_id: { type: string, format: uuid }
                price_model: { type: string, enum: [hourly, fixed, quote_only] }
                rate_minor: { type: [integer, "null"] }
                years_experience: { type: [integer, "null"] }
      responses:
        "201": { description: Listed skill }
        "409":
          description: A required fact is not satisfied (precondition_unmet)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/PreconditionUnmet" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/ValidationProblem" }

  /provider/service-areas:
    post:
      tags: [Platform]
      operationId: setServiceArea
      summary: Set a service area (requires location_tracking consent)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [latitude, longitude, radius_m]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radius_m: { type: integer, minimum: 500, maximum: 100000 }
      responses:
        "201": { description: Service area }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }

  /notes:
    post:
      tags: [Notes (reference)]
      operationId: createNote
      summary: Create a note (P0-05 reference vertical slice)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AppVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "201":
          description: The created note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/ValidationProblem"

  /notes/{note}:
    get:
      tags: [Notes (reference)]
      operationId: getNote
      summary: Fetch a note the caller authored
      parameters:
        - name: note
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The note
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/Note"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated UUID. Replaying it returns the stored response (CLAUDE.md rule #3).
      schema:
        type: string
        format: uuid
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: App build MAJOR.MINOR.PATCH. Builds below the server minimum receive 426.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'

  schemas:
    Money:
      type: object
      description: Money is ALWAYS integer minor units + explicit currency. Never a float, never a formatted string.
      required: [amount_minor, currency]
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
          minLength: 3
          maxLength: 3
          examples: ["XAF"]

    Meta:
      type: object
      required: [api_version, server_time]
      properties:
        api_version:
          type: string
          examples: ["v1"]
        min_app_version:
          type: [string, "null"]
          examples: ["1.0.0"]
        server_time:
          type: string
          format: date-time

    Offer:
      type: object
      required: [id, job_id, provider_party_id, origin, status, expires_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        origin: { type: string, enum: [customer_direct, system_dispatch, provider_bid] }
        status: { type: string, enum: [pending, accepted, declined, withdrawn, expired, superseded] }
        amount: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    Engagement:
      type: object
      required: [id, job_id, provider_party_id, offer_id, agreed_amount, is_escrowed, accepted_at]
      properties:
        id: { type: string, format: uuid }
        job_id: { type: string, format: uuid }
        provider_party_id: { type: string, format: uuid }
        offer_id: { type: string, format: uuid }
        agreed_amount: { $ref: "#/components/schemas/Money" }
        is_escrowed: { type: boolean }
        accepted_at: { type: string, format: date-time }
        assignments: { type: array, items: { $ref: "#/components/schemas/Assignment" } }

    Assignment:
      type: object
      required: [id, worker_user_id, role, status]
      properties:
        id: { type: string, format: uuid }
        engagement_id: { type: string, format: uuid }
        worker_user_id: { type: string, format: uuid }
        assigned_by_user_id: { type: string, format: uuid }
        role: { type: string, enum: [lead, helper] }
        status: { type: string, enum: [assigned, accepted, declined, en_route, on_site, completed, removed] }
        assigned_at: { type: string, format: date-time }
        removed_at: { type: [string, "null"], format: date-time }
        scheduled_from: { type: [string, "null"], format: date-time }
        scheduled_to: { type: [string, "null"], format: date-time }

    Job:
      type: object
      required: [id, reference, title, engagement_mode, status]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        skill_id: { type: string, format: uuid }
        engagement_mode: { type: string, enum: [onsite, remote, hybrid] }
        assignment_mode: { type: string, enum: [direct, dispatch, bidding] }
        status: { type: string }
        price_model: { type: string }
        budget: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
        urgency: { type: integer }
        requires_verified_provider: { type: boolean }
        photos: { type: array, items: { type: string } }
        location:
          description: Coarse (quarter/city) for non-owners; exact (line1 + lat/lng) only for the owner. Null for remote jobs.
          oneOf:
            - type: "null"
            - type: object
              properties:
                quarter: { type: [string, "null"] }
                city: { type: string }
                region: { type: [string, "null"] }
                country_code: { type: string }
                line1: { type: string }
                landmark_note: { type: [string, "null"] }
                latitude: { type: number }
                longitude: { type: number }
        published_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    ProviderProfile:
      type: object
      required: [id, verification_tier]
      properties:
        id: { type: string, format: uuid }
        headline: { type: [string, "null"] }
        bio: { type: [string, "null"] }
        bio_language: { type: [string, "null"] }
        verification_tier: { type: integer }
        rating_avg: { type: [string, "null"] }
        rating_count: { type: integer }
        jobs_completed: { type: integer }
        accepts_direct: { type: boolean }
        accepts_dispatch: { type: boolean }
        accepts_bidding: { type: boolean }
        skills:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              skill_id: { type: string, format: uuid }
              price_model: { type: string, enum: [hourly, fixed, quote_only] }
              rate: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }
              years_experience: { type: [integer, "null"] }
        service_areas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              latitude: { type: number }
              longitude: { type: number }
              radius_m: { type: integer }

    Skill:
      type: object
      required: [id, slug, name, is_leaf, risk_tier, requires_license]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string, description: Localized name for the requested locale. }
        is_leaf: { type: boolean }
        risk_tier: { type: integer, minimum: 1, maximum: 3 }
        requires_license: { type: boolean }
        children:
          type: array
          items:
            $ref: "#/components/schemas/Skill"

    OtpRequestInput:
      type: object
      required: [phone_e164, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          examples: ["+237699000111"]
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpVerifyInput:
      type: object
      required: [phone_e164, code, purpose]
      properties:
        phone_e164:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
        code:
          type: string
        purpose:
          type: string
          enum: [signup, login, phone_change]

    OtpChallengeAccepted:
      type: object
      required: [challenge_id, expires_at]
      properties:
        challenge_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time

    User:
      type: object
      required: [id, phone_e164, locale, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        phone_e164:
          type: string
        email:
          type: [string, "null"]
        locale:
          type: string
          enum: [fr, en]
        comms_locale:
          type: string
          enum: [fr, en]
        status:
          type: string
          enum: [pending, active, suspended, closed]
        phone_verified_at:
          type: [string, "null"]
          format: date-time

    TokenPair:
      type: object
      required: [token_type, access_token, expires_in, refresh_token, refresh_expires_at]
      properties:
        token_type:
          type: string
          examples: ["Bearer"]
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime in seconds.
        refresh_token:
          type: string
        refresh_expires_at:
          type: string
          format: date-time

    UserEnvelope:
      type: object
      required: [data, registered, tokens]
      properties:
        data:
          $ref: "#/components/schemas/User"
        registered:
          type: boolean
        tokens:
          $ref: "#/components/schemas/TokenPair"

    Device:
      type: object
      required: [id, platform, app_version, has_push_token]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android, ios, web]
        app_version:
          type: string
        has_push_token:
          type: boolean
        last_seen_at:
          type: [string, "null"]
          format: date-time

    AddressInput:
      type: object
      required: [line1, city, latitude, longitude]
      properties:
        label: { type: [string, "null"] }
        line1: { type: string }
        quarter: { type: [string, "null"] }
        city: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string, minLength: 2, maxLength: 2 }
        landmark_note: { type: [string, "null"] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }

    Address:
      type: object
      required: [id, line1, city, latitude, longitude]
      properties:
        id: { type: string, format: uuid }
        label: { type: [string, "null"] }
        line1: { type: string }
        quarter: { type: [string, "null"] }
        city: { type: string }
        region: { type: [string, "null"] }
        country_code: { type: string }
        landmark_note: { type: [string, "null"] }
        latitude: { type: number }
        longitude: { type: number }

    NoteInput:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 2000

    Note:
      type: object
      required: [id, author_id, body, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        author_id:
          type: string
          format: uuid
        body:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Problem:
      type: object
      description: RFC 7807 problem+json — the single error shape for the whole API.
      required: [type, title, status, detail, trace_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        trace_id:
          type: string

    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string

    PreconditionUnmet:
      description: >
        A fact-gated capability that isn't satisfied (doc 10). NOT a 403 — a first-class prompt
        naming the missing fact and a deep link to resolve it inline.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [error, capability, missing_fact, resolve]
          properties:
            error:
              const: precondition_unmet
            capability:
              type: string
              examples: ["accept_paid_job"]
            missing_fact:
              type: string
              examples: ["identity_verified"]
            required_tier:
              type: [integer, "null"]
            resolve:
              type: object
              required: [type, deep_link]
              properties:
                type:
                  type: string
                deep_link:
                  type: string

  responses:
    Problem:
      description: An error (RFC 7807 problem+json)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationProblem:
      description: Validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    UpgradeRequired:
      description: The app build is below the supported minimum
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  min_app_version:
                    type: string
                  current_app_version:
                    type: string

security:
  - bearerAuth: []
