<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'jobs.title' | translate }}</ion-title>
  </ion-toolbar>

  <app-offline-strip></app-offline-strip>
</ion-header>

<ion-content [fullscreen]="true">
  <!-- Exactly ONE way to post a request in each state: the FAB while there are jobs to scroll past,
       the empty state's own button when there are none. There used to be three (a toolbar icon, a
       button and the FAB), all calling the same method. -->
  <div class="page hm-page-fill">
    @for (job of jobs(); track job.id) {
      <button class="hm-card job hm-tap" type="button" (click)="open(job)">
        <div class="row">
          <div class="ref">
            <b>{{ job.reference }}</b>
            <span class="title">{{ job.title }}</span>
          </div>
          <span [class]="'hm-pill ' + tone(job.status)">{{ 'status.' + job.status | translate }}</span>
        </div>

        <div class="row meta">
          <!-- An open job has no provider yet, and an empty cell here left the money pill floating
               alone on its own line. Say what is actually happening instead. -->
          <span class="hm-muted">{{ job.providerName || ('jobs.no_provider' | translate) }}</span>
          <!-- Nothing agreed and no budget named is not "0 FCFA". A job you have just posted
               without a figure would read as one worth nothing — the same mistake as showing an
               unrated provider a bare 0 (P6-09), which this app already refuses to make. -->
          @if (job.amountMinor > 0) {
            <span class="amount">{{ job.amountMinor | money }} <small>{{ 'money.currency' | translate }}</small></span>
          } @else {
            <span class="hm-pill tone-neutral">{{ 'jobs.no_budget' | translate }}</span>
          }
        </div>

        @if (job.milestonesTotal > 0) {
          <div class="row">
            <div class="bars" aria-hidden="true">
              @for (i of slots(job); track i) {
                <i [class.done]="i < job.milestonesDone"></i>
              }
            </div>
            <small class="hm-muted">{{ job.milestonesDone }}/{{ job.milestonesTotal }} {{ 'jobs.milestones' | translate }}</small>
          </div>
        }
      </button>
    } @empty {
      <app-empty-state
        icon="briefcase-outline"
        heading="jobs.empty_title"
        body="jobs.empty_body"
        actionLabel="newjob.title"
        actionIcon="add"
        (action)="postRequest()"
      ></app-empty-state>
    }
  </div>

  @if (jobs().length) {
    <ion-fab slot="fixed" vertical="bottom" horizontal="end">
      <ion-fab-button class="fab" (click)="postRequest()">
        <ion-icon name="add" aria-hidden="true"></ion-icon>
        <span class="sr-only">{{ 'newjob.title' | translate }}</span>
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
