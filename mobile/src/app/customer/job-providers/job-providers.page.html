<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/job/' + jobId" [text]="''"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'jobproviders.title' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="flex min-h-full flex-col mx-auto max-w-3xl px-4 pb-10">
    <p class="mt-2 mb-4 text-md leading-snug text-pretty text-content-muted">{{ 'jobproviders.lead' | translate }}</p>

    @for (p of providers(); track p.id) {
      <!-- A full-width tap target: avatar + info, with a trailing chevron into the profile. -->
      <button
        class="mb-2 flex w-full min-h-11 cursor-pointer items-center gap-2 rounded-lg border border-edge bg-surface-raised p-2 text-start text-inherit shadow-sm"
        type="button"
        (click)="openProfile(p)"
      >
        <div
          [class]="'grid size-13 flex-none place-items-center rounded-md text-md font-bold text-brand-contrast accent-' + p.accent"
          aria-hidden="true"
        >
          @if (p.initials) {
            {{ p.initials }}
          } @else {
            <ion-icon name="person-outline" class="text-[1.25em]"></ion-icon>
          }
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-1">
            <b class="truncate text-md tracking-snug">{{ p.name }}</b>
            @if (p.verified) {
              <ion-icon class="flex-none text-md text-brand" name="shield-checkmark" [attr.aria-label]="'discover.verified' | translate"></ion-icon>
            }
          </div>
          <div class="mt-0.5 flex flex-wrap items-center gap-1.5 text-xs text-content-muted">
            @if (p.rating > 0) {
              <span class="inline-flex items-center gap-0.5 font-bold text-warning">
                <ion-icon name="star" aria-hidden="true"></ion-icon>{{ p.rating | number:'1.1-1' }}
              </span>
              <span class="size-[3px] rounded-full bg-edge-strong" aria-hidden="true"></span>
            }
            @if (p.skill) {
              <span>{{ p.skill }}</span>
              <span class="size-[3px] rounded-full bg-edge-strong" aria-hidden="true"></span>
            }
            <span class="hm-pill" [class]="p.mode === 'remote' ? 'tone-info' : 'tone-brand'">
              {{ 'discover.mode.' + p.mode | translate }}
            </span>
          </div>
        </div>

        <ion-icon class="flex-none text-[1.1rem] text-content-muted" name="chevron-forward" aria-hidden="true"></ion-icon>
      </button>
    } @empty {
      @if (loading()) {
        <p class="grid place-items-center py-8 text-content-muted"><ion-spinner name="crescent"></ion-spinner></p>
      } @else {
        <app-empty-state
          icon="people-outline"
          heading="jobproviders.empty_title"
          body="jobproviders.empty_body"
        ></app-empty-state>
      }
    }
  </div>
</ion-content>
