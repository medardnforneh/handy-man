<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'chats.title' | translate }}</ion-title>
  </ion-toolbar>

  <app-offline-strip></app-offline-strip>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page hm-page-fill">
    @if (hasChats()) {
      <ion-searchbar
        class="hm-tap"
        [value]="query()"
        (ionInput)="onSearch($any($event.target).value)"
        [placeholder]="'chats.search' | translate"
        [attr.aria-label]="'chats.search' | translate"
      ></ion-searchbar>
    }

    @for (chat of chats(); track chat.id) {
      <button class="chat hm-tap" type="button" [class.is-unread]="chat.unread" (click)="open(chat)">
        <div [class]="'hm-avatar chat-av accent-' + chat.accent" aria-hidden="true">
          @if (chat.initials) {
            {{ chat.initials }}
          } @else {
            <ion-icon name="person-outline"></ion-icon>
          }
        </div>

        <div class="body">
          <div class="line">
            <b>{{ chat.providerName }}</b>
            <small class="hm-muted">{{ chat.time }}</small>
          </div>
          <div class="line">
            <!-- A server-narrated last message arrives as a KIND, so it is translated here rather
                 than printed in whatever language the server happened to compose it in. -->
            @if (chat.previewKey) {
              <span class="preview hm-muted">{{ chat.previewKey | translate }}</span>
            } @else {
              <span class="preview hm-muted">{{ chat.preview }}</span>
            }
            @if (chat.unread > 0) {
              <span class="unread">{{ chat.unread }}</span>
            }
          </div>
          <small class="ref hm-muted">{{ chat.reference }}</small>
        </div>
      </button>
    } @empty {
      <!-- Two different emptinesses: a search that matched nothing (the fix is to change the
           search) and an account with no conversations at all (the fix is to book someone). -->
      @if (hasChats()) {
        <app-empty-state
          icon="search-outline"
          heading="chats.no_match_title"
          body="chats.no_match_body"
        ></app-empty-state>
      } @else {
        <app-empty-state
          icon="chatbubbles-outline"
          heading="chats.empty_title"
          body="chats.empty_body"
          actionLabel="nav.customer"
          actionIcon="compass-outline"
          (action)="findHelp()"
        ></app-empty-state>
      }
    }
  </div>
</ion-content>
