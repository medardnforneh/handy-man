<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'chats.title' | translate }}</ion-title>
  </ion-toolbar>

  <app-offline-strip></app-offline-strip>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page">
    @if (hasChats()) {
      <ion-searchbar
        class="hm-tap"
        [value]="query()"
        (ionInput)="onSearch($any($event.target).value)"
        [placeholder]="'chats.search' | translate"
        [attr.aria-label]="'chats.search' | translate"
      ></ion-searchbar>
    }

    @for (chat of chats(); track chat.id) {
      <button class="chat hm-tap" type="button" [class.is-unread]="chat.unread" (click)="open(chat)">
        <div [class]="'hm-avatar chat-av accent-' + chat.accent" aria-hidden="true">{{ chat.initials }}</div>

        <div class="body">
          <div class="line">
            <b>{{ chat.providerName }}</b>
            <small class="hm-muted">{{ chat.time }}</small>
          </div>
          <div class="line">
            <!-- A server-narrated last message arrives as a KIND, so it is translated here rather
                 than printed in whatever language the server happened to compose it in. -->
            @if (chat.previewKey) {
              <span class="preview hm-muted">{{ chat.previewKey | translate }}</span>
            } @else {
              <span class="preview hm-muted">{{ chat.preview }}</span>
            }
            @if (chat.unread > 0) {
              <span class="unread">{{ chat.unread }}</span>
            }
          </div>
          <small class="ref hm-muted">{{ chat.reference }}</small>
        </div>
      </button>
    } @empty {
      <div class="empty">
        <ion-icon name="chatbubbles-outline" aria-hidden="true"></ion-icon>
        <p class="hm-empty">{{ (hasChats() ? 'chats.no_match' : 'chats.empty') | translate }}</p>
      </div>
    }
  </div>
</ion-content>
