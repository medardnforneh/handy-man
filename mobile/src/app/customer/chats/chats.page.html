<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'chats.title' | translate }}</ion-title>
  </ion-toolbar>

  <app-offline-strip></app-offline-strip>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="mx-auto flex min-h-full max-w-3xl flex-col px-[22px] pt-1 pb-tabbar md:px-8">
    @if (hasChats()) {
      <ion-searchbar
        class="min-h-11"
        [value]="query()"
        (ionInput)="onSearch($any($event.target).value)"
        [placeholder]="'chats.search' | translate"
        [attr.aria-label]="'chats.search' | translate"
      ></ion-searchbar>
    }

    @for (chat of chats(); track chat.id) {
      <button
        class="flex w-full min-h-11 cursor-pointer items-center gap-3 border-0 border-b border-solid border-b-edge-soft bg-transparent px-0 py-[15px] text-start text-inherit font-sans text-md last-of-type:border-b-0"
        type="button"
        (click)="open(chat)"
      >
        <div
          class="grid size-10 flex-none place-items-center rounded-[13px] text-sm font-extrabold" [class]="chat.unread ? 'bg-brand text-brand-contrast' : 'bg-surface-sunken text-content'"
          aria-hidden="true"
        >
          @if (chat.initials) {
            {{ chat.initials }}
          } @else {
            <ion-icon name="person-outline" class="text-[1.25em]"></ion-icon>
          }
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-center justify-between gap-2">
            <!-- Unread threads read louder: the name goes full-strength and the preview stops
                 looking muted. -->
            <b class="truncate text-md font-bold">{{ chat.providerName }}</b>
            <small class="flex-none text-2xs text-content-muted">{{ chat.time }}</small>
          </div>
          <div class="flex items-center justify-between gap-2">
            <!-- A server-narrated last message arrives as a KIND, so it is translated here rather
                 than printed in whatever language the server happened to compose it in. -->
            <span
              class="min-w-0 flex-1 truncate text-sm"
              [class]="chat.unread ? 'text-content-secondary' : 'text-content-muted'"
            >{{ chat.previewKey ? (chat.previewKey | translate) : chat.preview }}</span>
            @if (chat.unread > 0) {
              <span class="grid h-5 min-w-5 flex-none place-items-center rounded-pill bg-brand px-1.5 text-2xs font-bold text-brand-contrast">{{ chat.unread }}</span>
            }
          </div>
          <small class="mt-0.5 block text-2xs text-content-muted">{{ chat.reference }}</small>
        </div>
      </button>
    } @empty {
      <!-- THREE emptinesses, not two. The third is "we have not been told yet", and it is the one
           that used to be papered over with three fabricated conversations. Saying "no messages
           yet" to someone who has messages is the same lie in a quieter voice, so the shape of the
           list is drawn until the server answers. Widths differ per line because a column of
           identical bars reads as a pattern rather than as text. -->
      @if (!loaded()) {
        @for (i of [1, 2, 3]; track i) {
          <div class="flex w-full items-center gap-2 border-b border-b-edge py-2 last-of-type:border-b-0" aria-hidden="true">
            <div class="hm-skel size-10 flex-none rounded-[13px]"></div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <span class="hm-skel h-[0.9em] w-2/5"></span>
                <span class="hm-skel ms-auto h-[0.75em] w-10"></span>
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="hm-skel h-[0.8em] w-2/3"></span>
              </div>
              <span class="hm-skel mt-1.5 block h-[0.7em] w-22"></span>
            </div>
          </div>
        }
        <p class="sr-only">{{ 'common.loading' | translate }}</p>
      } @else if (hasChats()) {
        <app-empty-state
          icon="search-outline"
          heading="chats.no_match_title"
          body="chats.no_match_body"
        ></app-empty-state>
      } @else {
        <app-empty-state
          icon="chatbubbles-outline"
          heading="chats.empty_title"
          body="chats.empty_body"
          actionLabel="nav.customer"
          actionIcon="compass-outline"
          (action)="findHelp()"
        ></app-empty-state>
      }
    }
  </div>
</ion-content>
