<!-- One shell, two shapes: the split pane promotes the menu to a permanent rail from `md` up (see
     pro-tabs.page.scss, which hides the tab pill at the same breakpoint); below that the floating
     tab pill is the navigation. Mirrors the customer shell — the provider app is not designed in
     the handoff, so it shares every token and component the customer shell has. -->
<ion-split-pane contentId="pro-tabs-content" when="(min-width: 768px)">
  <ion-menu contentId="pro-tabs-content" type="overlay" [swipeGesture]="false">
    <ion-content class="hm-rail">
      <div class="flex h-full flex-col">
        <div class="flex items-center gap-2.5 px-2 pt-2 pb-7">
          <span class="grid size-8 flex-none place-items-center rounded-[11px] bg-brand text-[1rem] text-brand-contrast" aria-hidden="true">
            <ion-icon name="hammer-outline"></ion-icon>
          </span>
          <strong class="text-md font-bold tracking-snug text-content">{{ 'app.name' | translate }}</strong>
          <span class="ms-auto rounded-[8px] bg-surface-sunken px-2 py-1 text-[10px] font-extrabold uppercase tracking-wide text-content-muted">{{ 'pro.title' | translate }}</span>
        </div>

        <nav class="grid gap-1" [attr.aria-label]="'pro.title' | translate">
          @for (item of items; track item.tab) {
            <a
              class="hm-rail-item flex min-h-11 items-center gap-3 rounded-[13px] px-3 py-2.5 text-md font-semibold no-underline"
              [routerLink]="['/pro', item.tab]"
              routerLinkActive="active"
            >
              <ion-icon class="text-[18px]" [name]="item.icon" aria-hidden="true"></ion-icon>
              <span class="min-w-0 flex-1">{{ item.label | translate }}</span>
            </a>
          }
        </nav>

        <button
          type="button"
          class="mt-auto flex min-h-11 cursor-pointer items-center gap-3 rounded-[14px] border border-edge bg-surface-raised px-3 py-2.5 text-start font-sans text-sm font-semibold text-content"
          (click)="backToCustomer()"
        >
          <ion-icon class="text-[18px] text-content-muted" name="swap-horizontal-outline" aria-hidden="true"></ion-icon>
          <span class="min-w-0 flex-1">{{ 'pro.back_to_customer' | translate }}</span>
        </button>
      </div>
    </ion-content>
  </ion-menu>

  <ion-tabs id="pro-tabs-content">
    <ion-tab-bar slot="bottom">
      @for (item of items; track item.tab) {
        <ion-tab-button [tab]="item.tab" class="min-h-11 min-w-11">
          <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
          <ion-label>{{ item.label | translate }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  </ion-tabs>
</ion-split-pane>
