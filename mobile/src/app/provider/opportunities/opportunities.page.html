<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title class="sr-only">{{ 'pro.opportunities' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="mx-auto flex min-h-full max-w-3xl flex-col px-[22px] pt-3 pb-tabbar md:px-8">
    <h1 class="mt-1 mb-3 text-[30px] font-extrabold leading-[1.06] tracking-tight text-balance">{{ 'pro.leads_title' | translate }}</h1>

    <!-- One row per request, divided by lines: the trade's glyph, what and where, the budget or
         the fact that one was not named. Tapping opens the lead and its quote composer. -->
    @for (lead of leads(); track lead.id; let first = $first) {
      <button
        class="box-border flex w-full cursor-pointer items-center gap-3 border-0 border-b border-solid border-edge-soft bg-transparent px-0 py-[15px] text-start text-inherit font-sans text-md last:border-b-0"
        type="button"
        (click)="openLead(lead)"
      >
        <span class="grid size-[46px] flex-none place-items-center rounded-[16px] text-[19px]" [class]="first ? 'bg-brand text-brand-contrast' : 'bg-surface-sunken text-brand'" aria-hidden="true">
          <ion-icon name="briefcase-outline"></ion-icon>
        </span>
        <span class="min-w-0 flex-1">
          <b class="block truncate text-[15.5px] font-bold tracking-snug">{{ lead.title }}</b>
          <span class="mt-0.5 block truncate text-xs text-content-muted">
            @if (lead.skill) {
              {{ lead.skill }}<span class="mx-1.5 inline-block size-[3px] -translate-y-[3px] rounded-full bg-content-muted" aria-hidden="true"></span>
            }
            @if (lead.area) {
              {{ lead.area }}
            } @else {
              {{ 'discover.mode.remote' | translate }}
            }
            <span class="mx-1.5 inline-block size-[3px] -translate-y-[3px] rounded-full bg-content-muted" aria-hidden="true"></span>{{ lead.postedAgo }}
          </span>
        </span>
        <span class="flex-none text-end">
          @if (lead.budgetMinor) {
            <b class="block text-md font-extrabold">{{ lead.budgetMinor | money }}</b>
            <small class="block text-2xs text-content-muted">{{ 'money.currency' | translate }}</small>
          } @else {
            <span class="hm-pill tone-neutral">{{ 'pro.quote_requested' | translate }}</span>
          }
        </span>
      </button>
    } @empty {
      <!-- Nothing to bid on is not a failure and there is no button that conjures a customer, so
           this state explains what would put something here rather than offering a dead action. -->
      <app-empty-state
        icon="briefcase-outline"
        heading="pro.no_opportunities_title"
        body="pro.no_opportunities_body"
        actionLabel="pro.no_opportunities_cta"
        actionIcon="person-outline"
        (action)="openProfile()"
      ></app-empty-state>
    }
  </div>
</ion-content>
