<ion-header [translucent]="true" class="ion-no-border">
  <ion-toolbar>
    <ion-title>{{ 'pro.active_work' | translate }}</ion-title>
  </ion-toolbar>

  <app-offline-strip></app-offline-strip>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="flex min-h-full flex-col mx-auto max-w-3xl px-4 pt-2 pb-10">
    @for (work of active(); track work.id) {
      <button
        class="mb-2 flex w-full min-h-11 cursor-pointer items-center gap-2 rounded-lg border border-edge bg-surface-raised px-4 py-2 text-start text-inherit shadow-sm"
        type="button"
        (click)="open(work)"
      >
        <div
          [class]="'grid size-10 flex-none place-items-center rounded-full text-sm font-bold uppercase text-brand-contrast accent-' + work.accent"
          aria-hidden="true"
        >{{ work.customerName.charAt(0) || '•' }}</div>
        <div class="min-w-0 flex-1">
          <b class="text-md">{{ work.title }}</b>
          <small class="block text-xs text-content-muted">{{ work.reference }} · {{ work.customerName }}</small>
        </div>
        <span [class]="'hm-pill flex-none ' + tone(work.status)">{{ 'status.' + work.status | translate }}</span>
      </button>
    } @empty {
      <app-empty-state
        icon="construct-outline"
        heading="pro.no_work_title"
        body="pro.no_work_body"
        actionLabel="pro.opportunities"
        actionIcon="briefcase-outline"
        (action)="browseOpportunities()"
      ></app-empty-state>
    }
  </div>
</ion-content>
