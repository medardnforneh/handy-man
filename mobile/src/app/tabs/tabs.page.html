<!-- One shell, two shapes: the split pane promotes the menu to a permanent side rail from
     `md` up (see tabs.page.scss, which hides the tab bar at the same breakpoint), and below
     that the menu stays closed and the bottom tab bar is the navigation. -->
<ion-split-pane contentId="tabs-content" when="(min-width: 768px)">
  <ion-menu contentId="tabs-content" type="overlay" [swipeGesture]="false">
    <ion-content class="hm-rail">
      <div class="flex items-center gap-2 px-2 pt-2 pb-6">
        <span class="grid size-[38px] flex-none place-items-center rounded-md bg-brand text-[1.15rem] text-brand-contrast" aria-hidden="true">
          <ion-icon name="hammer-outline"></ion-icon>
        </span>
        <span class="flex min-w-0 flex-col">
          <strong class="text-md font-bold tracking-snug text-content">{{ 'app.name' | translate }}</strong>
          <small class="text-2xs leading-tight text-content-muted">{{ 'app.tagline' | translate }}</small>
        </span>
      </div>

      <p class="mt-0 mb-1 px-2 text-2xs font-bold uppercase tracking-[0.09em] text-content-muted">{{ 'nav.customer' | translate }}</p>

      <ion-list lines="none">
        @for (item of items; track item.tab) {
          <ion-item
            class="hm-tap"
            [routerLink]="['/tabs', item.tab]"
            routerLinkActive="active"
            [detail]="false"
            button
          >
            <ion-icon slot="start" [name]="item.icon" aria-hidden="true"></ion-icon>
            <ion-label>{{ item.label | translate }}</ion-label>
          </ion-item>
        }
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-tabs id="tabs-content">
    <ion-tab-bar slot="bottom">
      @for (item of items; track item.tab) {
        <ion-tab-button [tab]="item.tab" class="hm-tap">
          <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
          <ion-label>{{ item.label | translate }}</ion-label>
        </ion-tab-button>
      }
    </ion-tab-bar>
  </ion-tabs>
</ion-split-pane>
