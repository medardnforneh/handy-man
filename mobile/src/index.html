<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8"/>
  <title>HandyMan</title>

  <base href="/"/>

  <meta name="color-scheme" content="light dark"/>
  <!-- The browser chrome around the installed app. Two values so the system bar follows the
       theme instead of pinning one palette; they are the brand token in each mode (tokens.json). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0a7d54"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2ea77d"/>
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="format-detection" content="telephone=no"/>
  <meta name="msapplication-tap-highlight" content="no"/>

  <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="HandyMan"/>
  <link rel="manifest" href="manifest.webmanifest"/>
</head>

<body>
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>

</html>
