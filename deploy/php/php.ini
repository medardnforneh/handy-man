; Production PHP settings for the app image (deploy/Dockerfile).
; Opcache is the single biggest lever on a request's cost — the dev machine learnt this the hard
; way: without it every request costs ~4s (docs/BUILD_STATE.md). Validation off: the code in the
; image never changes; a deploy is a new image.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=off

memory_limit=256M

; Verification documents and job photos come through here. "The API's own limits are the real cap"
; is what this comment used to say, and it is the wrong way round: PHP wins. A body over
; post_max_size is DISCARDED before Laravel sees it, so $_POST and $_FILES arrive empty and the
; validator answers "photos.*.file is required" — which reads as a bug in the app rather than as
; "too large". At 30M an on-site job report of five modern phone photos hit exactly that, in the
; core provider flow.
;
; upload_max_filesize clears the per-file rule with room to spare (verification documents, report
; photos and voice notes are all capped at max:10240 = 10M), and post_max_size now covers a
; realistic multi-photo report instead of barely three.
;
; STILL INCONSISTENT, and it wants a product decision rather than a bigger number: a job report
; declares `photos` as array max:20, and 20 × 10M will not fit in any post_max_size worth setting
; on one box. Either the report caps the count it really wants, or the app downscales before
; upload — and since the API is additive-only (CLAUDE.md rule #4) the declared rule cannot simply
; be tightened. max_file_uploads is pinned because PHP's own default of 20 silently IS that cap.
upload_max_filesize=25M
post_max_size=64M
max_file_uploads=20
max_execution_time=60
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
date.timezone=Africa/Douala
