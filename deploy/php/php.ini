; Production PHP settings for the app image (deploy/Dockerfile).
; Opcache is the single biggest lever on a request's cost — the dev machine learnt this the hard
; way: without it every request costs ~4s (docs/BUILD_STATE.md). Validation off: the code in the
; image never changes; a deploy is a new image.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.jit=off

memory_limit=256M
; Verification documents and job photos come through here; the API's own limits are the real cap.
upload_max_filesize=25M
post_max_size=30M
max_execution_time=60
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
date.timezone=Africa/Douala
