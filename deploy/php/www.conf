; PHP-FPM pool for the app image. Sized for one modest in-country box (the hosting ADR): the
; workload is short API requests and Blade pages, and the expensive things (webhooks, pushes,
; WhatsApp, deposit capture) ride the outbox and Horizon, not the request.
[www]
pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; Requests that take longer than this are worth a log line; the API's own budget is far below it.
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
