# The production stack (docs/11-deployment.md). One box, in country (docs/adr/0001-hosting-region.md).
#
#   cp deploy/.env.production.example deploy/.env   # fill it in
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
#
# Every PHP role runs the SAME image with a different command, so the code that answers a request,
# relays the outbox, works the queue and serves the socket is one build. Postgres and Redis are
# here too: self-managed, on the same host, per the ADR — until there is a reason for more.

name: handyman

x-app: &app
  image: handyman-app:latest
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_HOST: postgres
    REDIS_HOST: redis
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    SESSION_DRIVER: redis
    BROADCAST_CONNECTION: reverb
    # The server the BACKEND publishes to (broadcasting), on the internal network; the server
    # Reverb BINDS is REVERB_SERVER_HOST below. Both are the same process.
    REVERB_HOST: reverb
    REVERB_PORT: "8080"
    REVERB_SCHEME: http
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  # ---- the edge: TLS, static files, the PWA, FastCGI to PHP, websocket to Reverb ----
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    image: handyman-web:latest
    environment:
      SITE_HOST: ${SITE_HOST}
      APP_HOST: ${APP_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # The public storage link only — media lives in MinIO and is served by Laravel.
      - storage:/var/www/html/storage:ro
    depends_on:
      - app
      - reverb
    restart: unless-stopped

  # ---- PHP-FPM: every HTTP request ----
  app:
    <<: *app
    # The one place the PHP image is built; the daemons below run the image this produces.
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---- the transactional outbox relay: pushes, WhatsApp, deposit capture, broadcasts ----
  outbox:
    <<: *app
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "outbox:relay"]

  # ---- the Redis queue (Horizon) ----
  horizon:
    <<: *app
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- the schedule (routes/console.php) ----
  scheduler:
    <<: *app
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

  # ---- the realtime server ----
  reverb:
    <<: *app
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    environment:
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
    expose:
      - "8080"

  # ---- data ----
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---- object storage (doc 04, ADR 0001: in-country, self-managed) ----
  # Two buckets, two users: `media` for job photos and voice notes, `verification` for identity
  # papers — the app can be given one credential without the other, which is the doc-04 promise.
  # Nothing is public: every byte is served by Laravel after an entitlement check.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: buckets, users and least-privilege policies. Idempotent — safe on every `up`.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      MEDIA_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      VERIFICATION_ACCESS_KEY: ${VERIFICATION_AWS_ACCESS_KEY_ID}
      VERIFICATION_SECRET_KEY: ${VERIFICATION_AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    entrypoint: ["sh", "/init.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  storage:
  caddy_data:
  caddy_config:
